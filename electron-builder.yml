appId: com.dshapp.desktop
productName: DSH APP
copyright: Copyright © 2026 dsh-app contributors
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - package.json
asar: true
npmRebuild: false

# Kernel runtime tarball shipped inside the installer so first launch can
# activate it locally without a download. prepare-bundled-kernel.mjs copies
# the matching platform/arch tgz into bundled-kernel/ before packaging.
extraResources:
  - from: bundled-kernel
    to: kernel
    filter: ["kernel.tgz", "kernel.tgz.sha512", "manifest.json"]

# ---- Shell update channel (electron-updater, GitHub Releases) ----
publish:
  provider: github
  owner: JochenYang
  repo: dsh-app

win:
  target:
    - target: nsis
  # arch is chosen by the CI command line (--x64 / --arm64); omitting it here
  # avoids every app job building both arches and colliding on release assets.
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DSH APP

mac:
  target:
    - target: dmg
    - target: zip
  # arch chosen by CI command line (--x64 / --arm64).
  category: public.app-category.developer-tools
  # Notarization is enabled in CI via `--config.mac.notarize=true` when
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are present.
  # Keep it false so local unsigned builds still work.
  notarize: false

linux:
  target:
    - target: AppImage
    - target: deb
  # arch chosen by CI command line. Note: deb packaging uses fpm, which
  # ships only an x86 binary and cannot run on arm64 Linux runners; arm64
  # CI jobs restrict to AppImage only via --config.linux.target.
  category: Development
  synopsis: DSH APP desktop client for DeepSeek Harness
