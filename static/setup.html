<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>DSH App — Setup</title>
  <link rel="stylesheet" href="setup.css" />
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">D</div>
      <h1>DSH App</h1>
      <p class="tagline">DeepSeek Harness Desktop</p>
    </div>

    <div class="status">
      <div id="phase" class="phase">Checking…</div>
      <div id="message" class="message">Preparing the kernel runtime.</div>
      <div class="progress-track"><div id="progress" class="progress-fill" style="width:0%"></div></div>
    </div>

    <div class="actions">
      <button id="install" class="primary" hidden>Install</button>
      <button id="cancel" class="ghost">Cancel</button>
    </div>
    <p id="error" class="error" hidden></p>
  </main>
  <script src="setup.js"></script>
</body>
</html>
