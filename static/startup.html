<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data: file:;">
<!-- Alpha 0 lets the native window controls on Windows stay 100% transparent while sampling the right luminance -->
<meta name="theme-color" content="rgba(240, 245, 253, 0)">
<title>DSH APP</title>
<script>
(function() {
  try {
    var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', 'rgba(7, 10, 19, 0)');
    }
  } catch (e) {}
})();
window.__dshStartup = { view: null, failure: null, onView: null, onFailure: null };
window.__dshStartupUpdate = function (view) {
  var api = window.__dshStartup;
  if (api.onView) { api.onView(view); return true; }
  api.view = view;
  return false;
};
window.__dshStartupShowFailure = function (config) {
  var api = window.__dshStartup;
  if (api.onFailure) return api.onFailure(config);
  return new Promise(function (resolve) {
    api.failure = { config: config, resolve: resolve };
  });
};
</script>
<style>
  /* ========================================================== Design System Tokens */
  :root {
    /* Light Theme (Ethereal Sky — Default matching Reference Mockup)
     *
     * The secondary layer is deliberately NOT the pale end of the slate ramp it
     * used to be (#94a3b8 and a 0.07-alpha rail): on #f0f5fd those sat at 2.0-2.6
     * to 1, so the rail read as one continuous line and the footer, the pending
     * steps and the "APP" wordmark all looked washed out rather than quiet. Every
     * value below is measured against #f0f5fd: body text >= 4.5:1, and the rail's
     * fill against its own track >= 3:1 (WCAG 1.4.11 — the graph carries the
     * progress, so its boundary is not decoration). */
    --bg-base: #f0f5fd;
    --bg-gradient: radial-gradient(circle at 50% 32%, #ffffff 0%, #edf4fe 52%, #e5effc 100%);
    --text-title: #0f172a;
    --text-subtitle: #5b6a80;
    --text-dim: #78879b;
    --brand-dsh: #0f172a;
    --brand-app: #0284c7;
    --brand-accent: #2563eb;
    --pill-border: rgba(100, 116, 139, 0.45);
    --pill-text: #5b6a80;
    --rail-bg: rgba(15, 23, 42, 0.11);
    --rail-border: rgba(15, 23, 42, 0.10);
    --rail-fill: linear-gradient(90deg, #2563eb 0%, #1e40af 100%);
    /* A white bloom, not a blue one: the leading edge is the one thing worth
       looking at, and on a deep blue fill a second blue has nothing to say. */
    --rail-bloom: rgba(255, 255, 255, 0.22);
    --rail-sweep: rgba(37, 99, 235, 0.28);
    /* A tick is a CUT in the bar, so it takes the page's own colours: a slate
       notch on the empty channel, a white one on the deep blue fill. The crossed
       values are the trap — a pale tick on the pale track, or a white one on a
       bright fill, disappears exactly where it is needed. */
    --node-inactive: #475569;
    --node-done: rgba(255, 255, 255, 0.72);
    --check-done: #059669;
    --check-active: #2563eb;
    --step-done-text: #334155;
    --step-active-text: #0f172a;
    --step-pending-text: #78879b;
    --divider: rgba(100, 116, 139, 0.35);
    --footer-line: rgba(100, 116, 139, 0.30);
    --footer-text: #78879b;
    --sphere-halo: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, rgba(147, 197, 253, 0.12) 48%, transparent 72%);
    --modal-bg: rgba(255, 255, 255, 0.95);
    --modal-border: rgba(15, 23, 42, 0.08);
    --btn-bg: rgba(15, 23, 42, 0.04);
    --btn-border: rgba(15, 23, 42, 0.12);
    --btn-text: #0f172a;
    --btn-primary-bg: #0f172a;
    --btn-primary-fg: #ffffff;
  }

  html[data-theme="dark"] {
    /* Dark Theme (Abyssal Cosmic Midnight) */
    --bg-base: #070a13;
    --bg-gradient: radial-gradient(circle at 50% 32%, #111a30 0%, #0a0e1c 55%, #05070e 100%);
    --text-title: #f8fafc;
    --text-subtitle: #94a3b8;
    --text-dim: #7c8da4;
    --brand-dsh: #ffffff;
    --brand-app: #38bdf8;
    --brand-accent: #38bdf8;
    --pill-border: rgba(255, 255, 255, 0.15);
    --pill-text: #94a3b8;
    /* A 0.07-alpha track is all but invisible over #070a13, which made the bar
       look shorter than it is; 0.10 draws the whole channel without competing
       with the fill. */
    --rail-bg: rgba(255, 255, 255, 0.10);
    --rail-border: rgba(255, 255, 255, 0.06);
    --rail-fill: linear-gradient(90deg, #38bdf8 0%, #2563eb 100%);
    --rail-bloom: rgba(125, 211, 252, 0.50);
    --rail-sweep: rgba(56, 189, 248, 0.22);
    --node-inactive: rgba(255, 255, 255, 0.45);
    /* Dark-on-bright-fill, the mirror of the light theme: this line's fill runs
       to a bright cyan, where a white notch measures 1.8:1 and vanishes. */
    --node-done: rgba(7, 10, 19, 0.68);
    --check-done: #10b981;
    --check-active: #38bdf8;
    --step-done-text: #cbd5e1;
    --step-active-text: #ffffff;
    --step-pending-text: #8b98a9;
    --divider: rgba(255, 255, 255, 0.14);
    --footer-line: rgba(255, 255, 255, 0.12);
    --footer-text: #7c8da4;
    --sphere-halo: radial-gradient(circle, rgba(30, 58, 138, 0.38) 0%, rgba(56, 189, 248, 0.12) 50%, transparent 72%);
    --modal-bg: rgba(15, 23, 42, 0.94);
    --modal-border: rgba(255, 255, 255, 0.12);
    --btn-bg: rgba(255, 255, 255, 0.08);
    --btn-border: rgba(255, 255, 255, 0.14);
    --btn-text: #f8fafc;
    --btn-primary-bg: #38bdf8;
    --btn-primary-fg: #070a13;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; padding: 0; }

  /* html paints the background; body stays transparent for native window-controls sampling */
  html {
    background: var(--bg-base);
    transition: background-color 0.45s ease;
  }

  body {
    position: relative;
    overflow: hidden;
    background: transparent;
    color: var(--text-title);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Titlebar Drag Strip — 140px on right kept clear for native window controls */
  #startup-titlebar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 38px;
    padding-right: 140px;
    -webkit-app-region: drag;
    z-index: 60;
  }

  /* Atmospheric Background: one soft radial field, no decorative linework.
     A horizon arc used to be drawn here as an SVG overlay; at common window
     aspect ratios it crossed the boot rail and ran out past the track, so it
     read as a stray streak rather than an orbit. The field alone carries the
     depth without ever colliding with content. */
  #bg-ambient {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    background: var(--bg-gradient);
    transition: background 0.5s ease;
  }

  /* ========================================================== Monolithic Layout */
  .stage-monolith {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 680px;
    padding: 0 24px;
    text-align: center;
    animation: stageFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes stageFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========================================================== Center Stage: Whale + Orbitals */
  .whale-stage-wrap {
    position: relative;
    width: min(50vmin, 380px);
    height: min(44vmin, 330px);
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sphere-halo-back {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: var(--sphere-halo);
    pointer-events: none;
    z-index: 1;
    animation: haloBreathe 7s ease-in-out infinite;
  }

  @keyframes haloBreathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  #whale-canvas {
    position: relative;
    z-index: 3;
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;
  }

  /* ========================================================== Brand Row */
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .brand-logo-badge {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    background: transparent;
    flex-shrink: 0;
  }
  .brand-logo-badge .brand-logo-img {
    width: 28px;
    height: 28px;
    display: block;
    object-fit: cover;
    border-radius: 7px;
  }

  .brand-title {
    display: flex;
    align-items: baseline;
    gap: 5px;
    line-height: 1;
  }

  .brand-dsh {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--brand-dsh);
  }

  .brand-app {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--brand-app);
  }

  .version-pill {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--pill-border);
    color: var(--pill-text);
    background: transparent;
  }

  /* ========================================================== Status Headline & Subtitle */
  #startup-status {
    margin: 0 0 6px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-title);
    min-height: 25px;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  #startup-status.fade-trans {
    opacity: 0;
    transform: translateY(3px);
  }

  #startup-hint {
    margin: 0 0 26px;
    font-size: 12.5px;
    color: var(--text-subtitle);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  /* ========================================================== Boot Rail */
  /* One instrument, not a bar with decorations on it. The track CLIPS
     everything it paints (`overflow: hidden`), so a glow, a milestone mark or
     the indeterminate sweep can never reach outside the rail — an escaped
     glow reads as a stray streak across the page. */
  .progress-section {
    width: min(520px, 94%);
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }

  .progress-bar-wrap {
    position: relative;
    flex: 1 1 auto;
    height: 6px;
    border-radius: 999px;
    background: var(--rail-bg);
    box-shadow: inset 0 0 0 1px var(--rail-border);
    overflow: hidden;
    isolation: isolate;
  }

  /* The fill is a full-size gradient revealed by a CLIP, not a box that
     changes width. Clipping leaves the gradient's own geometry untouched, so
     the leading edge keeps the same colour at every value — resizing a box
     slides the gradient and the head colour drifts as it travels.
     `--rail-p` is the single source of truth, written by one animator. */
  #startup-bar-fill {
    position: absolute;
    inset: 0;
    background: var(--rail-fill);
    clip-path: inset(0 calc(100% - var(--rail-p, 0%)) 0 0 round 999px);
  }

  /* Bloom at the leading edge. It rides `--rail-p`, the same value the fill
     clips to, so the two cannot drift apart. */
  #startup-bar-head {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--rail-p, 0%);
    width: 40px;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, var(--rail-bloom));
    pointer-events: none;
  }

  /* Indeterminate says one thing only: no denominator has arrived. The fill
     still follows `--rail-p` — which the placeholder crawl drives — and the
     SWEEP is what marks the value as a guess. It used to be forced across the
     whole track at 45% opacity instead, which contradicted the readout beside
     it: a bar lit end to end sitting next to "3%", with the crawl's motion
     happening underneath and therefore invisible. */
  .progress-bar-wrap[data-mode="indeterminate"]::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, var(--rail-sweep) 50%, transparent 100%);
    animation: railSweep 1.9s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  @keyframes railSweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* Stage boundaries, drawn as hairlines INSIDE the track so they line up
     with the values they mark and cannot spill past the caps. */
  .progress-nodes {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* Stage boundaries, drawn INSIDE the track so they line up with the values
     they mark and cannot spill past the caps. Two pixels rather than a hairline:
     on a 6px track a 1px tick is invisible at 1x, and these are the only marks
     that say the bar is segmented into stages. */
  .p-node {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    transform: translateX(-50%);
  }

  .p-dot {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--node-inactive);
    transition: background-color 0.4s ease;
  }

  /* A passed tick sits ON the fill, an upcoming one on the empty channel — two
     surfaces that need opposite notch colours, which the two tokens above carry.
     Using one value for both is what hides half the ticks. */
  .p-node.done .p-dot {
    background: var(--node-done);
  }

  #startup-percent {
    flex: 0 0 auto;
    min-width: 44px;
    text-align: right;
    font-size: 13.5px;
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    /* The rail's own hue, so the number reads as part of the bar rather than as a
       separate badge next to it. */
    color: var(--brand-accent);
    letter-spacing: 0.02em;
  }

  /* ========================================================== Horizontal 5-Step Checklist with Dividers */
  .step-rail {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    list-style: none;
    margin: 0 0 28px;
    padding: 0;
    width: 100%;
  }

  .step-rail li.step-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--step-pending-text);
    transition: color 0.3s ease;
  }

  .step-badge {
    font-size: 11px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 13px;
    height: 13px;
    border-radius: 50%;
  }

  /* Done step */
  .step-rail li.step-item[data-state="done"] {
    color: var(--step-done-text);
  }
  .step-rail li.step-item[data-state="done"] .step-badge {
    color: var(--check-done);
    font-weight: 700;
  }

  /* Current step */
  .step-rail li.step-item[data-state="current"] {
    color: var(--step-active-text);
    font-weight: 600;
  }
  .step-rail li.step-item[data-state="current"] .step-badge {
    color: var(--check-active);
    font-size: 13px;
    animation: activeBadgeGlow 1.6s ease-in-out infinite;
  }

  @keyframes activeBadgeGlow {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px var(--brand-accent)); }
    50% { transform: scale(1.2); filter: drop-shadow(0 0 6px var(--brand-accent)); }
  }

  /* Pending step */
  .step-rail li.step-item[data-state="pending"] .step-badge {
    color: var(--text-dim);
  }

  /* Vertical Divider */
  .step-rail li.sep {
    width: 1px;
    height: 11px;
    background: var(--divider);
  }

  /* ========================================================== Footer Section */
  .footer-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    margin-top: 4px;
  }

  .footer-rule {
    flex: 0 1 48px;
    height: 1px;
    background: var(--footer-line);
  }

  #startup-saying {
    margin: 0;
    font-size: 11.5px;
    color: var(--footer-text);
    letter-spacing: 0.03em;
  }

  /* Action Buttons & Provenance */
  .footer-sub {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }

  #startup-pause {
    padding: 4px 14px;
    border-radius: 999px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  #startup-pause:hover:not(:disabled) {
    background: var(--btn-border);
  }

  #startup-digest {
    margin: 0;
    font-size: 10.5px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    color: var(--text-dim);
  }

  /* ========================================================== Failure Dialog */
  #startup-error {
    position: fixed;
    z-index: 100;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(520px, calc(100vw - 48px));
    max-height: calc(100vh - 80px);
    overflow: auto;
    padding: 24px 28px;
    border-radius: 20px;
    background: var(--modal-bg);
    border: 1px solid var(--modal-border);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    text-align: left;
    animation: modalRise 0.24s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* The scrim is its own element, not `#startup-error::before`. A `::before`
     with a negative z-index paints inside the CARD's stacking context (a
     `position: fixed` box creates one), so it darkened the card's own surface
     and left the page behind it undimmed — measured: the background was
     pixel-identical with the card up. A sibling dims what it should. */
  #startup-error-mask {
    position: fixed;
    inset: 0;
    z-index: 99;
    background: rgba(0, 0, 0, 0.45);
    animation: maskFade 0.24s ease;
  }

  @keyframes maskFade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #startup-error-title {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-title);
  }

  #startup-error-detail {
    margin: 0 0 16px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-subtitle);
    white-space: pre-line;
    word-break: break-all;
  }

  #startup-error-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  #startup-error button {
    padding: 7px 16px;
    border-radius: 10px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  #startup-error button[data-primary="true"] {
    background: var(--btn-primary-bg);
    border-color: var(--btn-primary-bg);
    color: var(--btn-primary-fg);
    font-weight: 500;
  }

  #startup-error .hint {
    margin: 0;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  @keyframes modalRise {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 12px)) scale(0.96); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  /* ========================================================== Reduced Motion */
  @media (prefers-reduced-motion: reduce) {
    .stage-monolith { animation: none; }
    .sphere-halo-back { animation: none; }
    .progress-bar-wrap[data-mode="indeterminate"]::after { animation: none; }
    .step-rail li.step-item[data-state="current"] .step-badge { animation: none; }
    #startup-error { animation: none; }
    #startup-error-mask { animation: none; }
  }
</style>
</head>
<body>
  <div id="startup-titlebar"></div>
  <div id="bg-ambient" aria-hidden="true"></div>

  <!-- Monolithic Unified Stage matching Reference Mockup -->
  <main class="stage-monolith">
    <!-- Center Graphic: Dotted Whale -->
    <div class="whale-stage-wrap">
      <div class="sphere-halo-back" aria-hidden="true"></div>
      <canvas id="whale-canvas" aria-hidden="true"></canvas>
    </div>

    <!-- Brand Row: DeepSeek Logo Badge + DSH APP + Version Pill -->

      canvas.width = Math.round(cssW * DPR);
      canvas.height = Math.round(cssH * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      scale = cssW / ART_CELLS_X;
    }

    // Pointer dynamics
    var pointer = { x: -999, y: -999, active: false };
    window.addEventListener('pointermove', function (e) {
      var rect = canvas.getBoundingClientRect();
      var px = e.clientX - rect.left;
      var py = e.clientY - rect.top;
      pointer.x = (px - canvasW / 2) / (ART_CELLS_X * scale);
      pointer.y = (canvasH / 2 - py) / (ART_CELLS_X * scale);
      pointer.active = (px >= -20 && px <= canvasW + 20 && py >= -20 && py <= canvasH + 20);
    });

    var START_TIME = performance.now();
    var ENTER_DURATION = 1100;
    var assembled = false;
    var lastFrame = 0;
    var FPS = 24;

    function renderAnimation(now) {
      requestAnimationFrame(renderAnimation);

      if (now - lastFrame < 1000 / FPS) return;
      lastFrame = now;

      ctx.clearRect(0, 0, canvasW, canvasH);

      var isDark = root.getAttribute('data-theme') === 'dark';
      var time = now / 1000;
      var cx = canvasW / 2;
      var cy = canvasH / 2 + 6;

      // Digitile Whale Mosaic
      var enterProgress = reduced ? 1 : Math.min(1, (now - START_TIME) / ENTER_DURATION);
      if (enterProgress >= 1) assembled = true;
      var baseS = (TILE_SIZE / CELL) * scale;

      for (var i = 0; i < TILES.length; i++) {
        var tl = TILES[i];
        var ox = 0, oy = 0, alphaMod = 1, scaleMod = 1;

        if (!assembled) {
          var delay = Math.min(0.5, tl.origDist * 1.4);
          var ep = Math.max(0, Math.min(1, (enterProgress - delay) / (1 - delay)));
          if (ep <= 0) continue;
          var ease = 1 - Math.pow(1 - ep, 3);
          var angle = Math.atan2(tl.gy, tl.gx || 1e-4) + (1 - ease) * 0.9;
          var dist = (1 - ease) * (0.45 + tl.seed * 0.6) * ART_CELLS_X * scale * 0.5;
          ox = Math.cos(angle) * dist;
          oy = Math.sin(angle) * dist;
          alphaMod = ease;
          scaleMod = 0.5 + ease * 0.5;
        }

        // Ambient fluid shimmer
        var wave = Math.sin(time * 1.5 + (tl.gx + tl.gy) * 5.8);
        var lum = tl.lum * (1 + wave * 0.12);

        // Interactive pointer displacement
        var px = 0, py = 0;
        if (pointer.active) {
          var dx = tl.gx - pointer.x;
          var dy = tl.gy - pointer.y;
          var d = Math.hypot(dx, dy);
          if (d < 0.24 && d > 1e-4) {
            var f = (1 - d / 0.24) * 0.04 * ART_CELLS_X * scale;
            px = (dx / d) * f;
            py = -(dy / d) * f;
          }
        }

        var tx = cx + tl.gx * ART_CELLS_X * scale + ox + px;
        var ty = cy - tl.gy * ART_CELLS_X * scale + oy + py;
        // Per-tile face scale (matches the session page). While the entry
        // animation is still running the size stays fractional so tiles grow
        // smoothly; once assembled it snaps to whole device pixels, which is
        // what keeps the resting mosaic crisp instead of softly anti-aliased.
        var currentS = baseS * tl.scale * scaleMod;
        if (assembled) currentS = Math.max(1, Math.round(currentS));

        // Theme colors matching reference
        if (isDark) {
          var rD = Math.round(56 + lum * 120);
          var gD = Math.round(150 + lum * 90);
          var bD = Math.round(245 + lum * 10);
          ctx.fillStyle = 'rgba(' + rD + ',' + gD + ',' + bD + ',' + (alphaMod * Math.min(1, 0.45 + tl.lum * 0.55)) + ')';
        } else {
          // Pure DeepSeek electric blue dots on crisp light background
          var rL = Math.round(25 + (1 - lum) * 20);
          var gL = Math.round(75 + (1 - lum) * 45);
          var bL = Math.round(210 + (1 - lum) * 35);
          ctx.fillStyle = 'rgba(' + rL + ',' + gL + ',' + bL + ',' + (alphaMod * Math.min(1, 0.65 + tl.lum * 0.35)) + ')';
        }

        ctx.fillRect(tx - currentS / 2, ty - currentS / 2, currentS, currentS);
      }
    }

    // ========================================================== Multi-Stage Linear Progress Engine
    var STAGES = [
      { id: 1, name: '准备运行时', from: 0.00, to: 0.25 },
      { id: 2, name: '解压运行时', from: 0.25, to: 0.50 },
      { id: 3, name: '激活运行时', from: 0.50, to: 0.75 },
      { id: 4, name: '启动内核服务', from: 0.75, to: 0.95 },
      { id: 5, name: '打开界面', from: 0.95, to: 1.00 }
    ];

    var currentStage = 1;
    var displayedProgress = 0;
    var targetProgress = 0;
    var stageStartTime = Date.now();
    var progressAnim = false;
    /**
     * Denominator reported by the CURRENT stage, or null while it has none.
     * Most kernel statuses carry `progress: null` (activation, cache verify,
     * the head of extraction), so the crawl below stands in for them. The
     * moment a real one arrives it owns the bar for that stage — a placeholder
     * must never outrun, or be contradicted by, a number the kernel sent.
     */
    var stageRealProgress = null;
    /**
     * How far into its own band the placeholder crawl may travel. A stage with
     * no denominator is not "85% done" — the cap keeps the bar from claiming it
     * is while still showing that work is moving.
     */
    var CRAWL_CAP = 0.85;
    /**
     * Time for the placeholder crawl to reach {@link CRAWL_CAP} of a band.
     *
     * Deliberately far longer than any stage really takes. The crawl exists for
     * phases that report no denominator at all, where it is the only sign of
     * life; a short ramp would instead make it a confident-looking estimate that
     * races ahead of the kernel and then sits there. Slow enough that real
     * progress — which arrives within a second for downloads and extraction —
     * always outruns it and takes the bar over.
     */
    var CRAWL_RAMP_MS = 25000;

    /**
     * Light the stage boundaries the fill has already passed.
     *
     * Keyed to the POSITION, not to the current stage: the fill is what the eye
     * follows, and a tick that stays dark after the fill has run past it reads as
     * a stalled stage — at stage 4 the 75% mark used to sit unlit under a bar
     * already at 90%. One rule for both, so bar and ticks can never disagree.
     *
     * Only interior boundaries exist as elements (25 / 50 / 75%): the 0% and
     * 100% ends are the track's own caps, and drawing a mark on top of a cap
     * reads as a rendering error rather than a milestone.
     */
    function setMilestoneNodes(fraction) {
      var position = fraction * 100;
      for (var i = 0; i < pNodes.length; i++) {
        var at = Number(pNodes[i].getAttribute('data-at'));
        pNodes[i].classList.toggle('done', position >= at);
      }
    }

    function updateStepRail(stageId, isFinished) {
      for (var s = 0; s < stepItems.length; s++) {
        var item = stepItems[s];
        var badge = item.querySelector('.step-badge');
        if (isFinished || s + 1 < stageId) {
          item.setAttribute('data-state', 'done');
          badge.textContent = '✔';
        } else if (s + 1 === stageId) {
          item.setAttribute('data-state', 'current');
          badge.textContent = '●';
        } else {
          item.setAttribute('data-state', 'pending');
          badge.textContent = '○';
        }
      }
    }

    /**
     * The ONE animator that moves the rail.
     *
     * It is time-based and frame-rate independent: each frame advances a fixed
     * share of the REMAINING distance toward the target, and the value written
     * is a float. The old version added a fixed 0.2-2% per frame and rounded to
     * whole percent before painting, so it moved in visible steps and its speed
     * depended on how many frames the machine happened to deliver.
     *
     * Nothing else may animate the rail: a CSS `transition` on the same
     * property would fight this loop, and the two easing curves together read
     * as the bar lagging and then lurching.
     */
    var RAIL_EASE = 0.14;
    function animateBar() {
      if (progressAnim) return;
      progressAnim = true;

      requestAnimationFrame(function step() {
        var diff = targetProgress - displayedProgress;
        if (Math.abs(diff) < 0.0005) {
          displayedProgress = targetProgress;
          paintProgress();
          progressAnim = false;
          return;
        }
        displayedProgress += diff * RAIL_EASE;
        paintProgress();
        requestAnimationFrame(step);
      });
    }

    function paintProgress() {
      // The exact value drives the rail; only the READOUT is rounded, so the
      // bar itself never steps by whole percent.
      var clamped = Math.min(1, Math.max(0, displayedProgress));
      barWrap.style.setProperty('--rail-p', (clamped * 100).toFixed(3) + '%');

      var pct = Math.round(clamped * 100);
      percentEl.textContent = pct + '%';
      barWrap.setAttribute('aria-valuenow', String(pct));

      var isFinished = pct >= 100;
      setMilestoneNodes(clamped);
      updateStepRail(currentStage, isFinished);
    }

    /**
     * Placeholder crawl for a stage that reports no denominator.
     *
     * It is a SHOW, never a claim: the bar drifts toward `CRAWL_CAP` of the
     * stage's own band so a long silent phase still reads as alive, but it
     * stops short of the band end — the next stage's arrival is what advances
     * the bar past it. A stage that has sent a real number is left alone, so
     * the ticker can never push the bar past the truth or backwards from it.
     */
    function crawlTarget() {
      var stageMeta = STAGES[currentStage - 1] || STAGES[0];
      var elapsed = Date.now() - stageStartTime;
      var ratio = Math.min(CRAWL_CAP, elapsed / CRAWL_RAMP_MS);
      return stageMeta.from + (stageMeta.to - stageMeta.from) * ratio;
    }

    setInterval(function () {
      if (currentStage >= 5 && targetProgress >= 1.0) return;
      if (stageRealProgress !== null) return;
      var next = crawlTarget();
      if (next > targetProgress) {
        targetProgress = next;
        animateBar();
      }
    }, 35);

    // ========================================================== Reactive State Dispatcher
    var pendingPause = null;

    function render(view) {
      var nextStage = Math.max(1, Math.min(stepItems.length, view.stage || 1));
      if (nextStage !== currentStage) {
        currentStage = nextStage;
        stageStartTime = Date.now();
        // A new stage starts with no denominator until it reports one.
        stageRealProgress = null;
      }

      // 1. Status Headline
      var newMsg = view.message || '正在启动 DSH 服务...';
      if (statusEl.textContent !== newMsg) {
        statusEl.classList.add('fade-trans');
        setTimeout(function () {
          statusEl.textContent = newMsg;
          statusEl.classList.remove('fade-trans');
        }, 100);
      }

      // 2. Theme Adaptation & Transparent Titlebar Color Sync
      var theme = view.theme === 'dark' ? 'dark' : 'light';
      root.setAttribute('data-theme', theme);
      if (metaTheme) {
        // Sets alpha 0 so window controls stay 100% transparent on Windows while passing luminance
        metaTheme.content = theme === 'dark' ? 'rgba(7, 10, 19, 0)' : 'rgba(240, 245, 253, 0)';
      }

      // 3. Progress calculation (Linear & Guaranteed 100% on Stage 5)
      var stageMeta = STAGES[currentStage - 1] || STAGES[0];

      if (currentStage >= 5 && (view.progress === 1 || view.stage === 5)) {
        stageRealProgress = 1;
        targetProgress = 1.00;
        barWrap.setAttribute('data-mode', 'determinate');
      } else if (typeof view.progress === 'number' && isFinite(view.progress)) {
        var bounded = Math.max(0, Math.min(1, view.progress));
        stageRealProgress = bounded;
        var mapped = stageMeta.from + (stageMeta.to - stageMeta.from) * bounded;
        // Never regress: a stage that reported no denominator may already have
        // crawled forward, and the first real number can land behind that
        // placeholder. Showing it would read as the bar going backwards.
        targetProgress = Math.max(targetProgress, mapped);
        barWrap.setAttribute('data-mode', 'determinate');
      } else {
        barWrap.setAttribute('data-mode', 'indeterminate');
        if (stageRealProgress === null) {
          var linearTarget = crawlTarget();
          if (linearTarget > targetProgress) targetProgress = linearTarget;
        }
      }
      animateBar();

      // 5. Brand stamp & Version
      if (view.brand) {
        if (view.brand.name) nameEl.textContent = 'DSH';
        versionEl.textContent = view.brand.version ? 'v' + view.brand.version : 'v0.15.1';
      }
      if (typeof view.saying === 'string' && view.saying !== '') {
        sayingEl.textContent = view.saying;
      }

      // 6. Localization
      if (view.skeleton) {
        for (var k = 0; k < stepItems.length && k < view.skeleton.steps.length; k++) {
          var stepText = stepItems[k].querySelector('.step-text');
          if (stepText) stepText.textContent = view.skeleton.steps[k];
        }
        if (hintEl && view.skeleton.hint) hintEl.textContent = view.skeleton.hint;
        if (failureHint && view.skeleton.failureHint) failureHint.textContent = view.skeleton.failureHint;
      }

      // 7. Pause control
      pauseBtn.hidden = view.pausable !== true;
      pauseBtn.textContent = view.paused === true
        ? (view.skeleton ? view.skeleton.resume : '继续下载')
        : (view.skeleton ? view.skeleton.pause : '暂停下载');

      if (view.pausable !== true && pendingPause !== null) {
        var settle = pendingPause;
        pendingPause = null;
        settle(false);
      }

      // 8. Provenance
      digestEl.textContent = view.digest ? '运行时已校验 · ' + view.digest : '';
      digestEl.hidden = !view.digest;
    }

    pauseBtn.addEventListener('click', function () {
      if (pendingPause === null) return;
      var resolve = pendingPause;
      pendingPause = null;
      resolve(true);
    });

    window.__dshStartupAwaitPause = function () {
      return new Promise(function (resolve) { pendingPause = resolve; });
    };

    function showFailure(config) {
      return new Promise(function (resolve) {
        errorTitle.textContent = config.title || '系统启动未能完成';
        errorDetail.textContent = config.detail || '';
        errorDetail.hidden = !config.detail;
        errorActions.textContent = '';
        var answered = false;
        var buttons = config.actions || [];
        buttons.forEach(function (action) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = action.label;
          if (action.primary) btn.setAttribute('data-primary', 'true');
          btn.addEventListener('click', function () {
            if (answered) return;
            answered = true;
            for (var m = 0; m < errorActions.children.length; m++) {
              errorActions.children[m].disabled = true;
            }
            resolve(action.id);
          });
          errorActions.appendChild(btn);
        });
        errorSheet.hidden = false;
        errorMask.hidden = false;
        var primaryBtn = errorActions.querySelector('button[data-primary="true"]');
        if (primaryBtn) primaryBtn.focus();
      });
    }

    api.onView = function (view) {
      errorSheet.hidden = true;
      errorMask.hidden = true;
      render(view);
    };
    api.onFailure = showFailure;

    // Drain early calls
    if (api.view) {
      var qv = api.view;
      api.view = null;
      api.onView(qv);
    }
    if (api.failure) {
      var qf = api.failure;
      api.failure = null;
      showFailure(qf.config).then(qf.resolve);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    setMilestoneNodes(0);
    requestAnimationFrame(renderAnimation);
  })();
  </script>
</body>
</html>
