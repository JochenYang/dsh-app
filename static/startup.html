<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<!--
  `media-src` is what lets the opening film load at all: `default-src 'none'`
  blocks every resource without a directive of its own, and a <video> is a
  media resource — dropping the file into static/media/ without this line
  renders an empty frame with no error anywhere (the same trap the finished-step
  check hit, below). `'self'` is the file: document's own directory; `file:` is
  spelled out because a file: URL's origin is opaque, so which of the two the
  engine matches is not something to bet on.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src 'self' file:">
<title>DSH APP</title>
<script>
/*
  Startup page (first-launch visibility). Loaded by src/main/startup-window.ts
  through file:// from inside app.asar; it must stay self-contained — no
  framework, no external resource, no network.

  State contract with the shell (all pushes arrive through
  webContents.executeJavaScript; there is no preload and no IPC):

    window.__dshStartupUpdate(view)         view = { stage, message, progress,
                                                     skeleton, brand, theme,
                                                     digest?, pausable?, paused?,
                                                     saying? }
    window.__dshStartupShowFailure(config)  config = { title, detail, actions }
                                            -> Promise<action id | null>

  Both entry points are defined here, before the markup exists, and QUEUE
  anything that arrives early; the renderer script at the end of the body
  installs the handlers and drains the queue. "stage" is 1-based and indexes
  the <li> list below, which the shell maps its status wording onto. "brand",
  "theme" and "skeleton" ride every push, so a page reload reproduces the same
  row, the same appearance and the same language.
*/
window.__dshStartup = { view: null, failure: null, onView: null, onFailure: null };

window.__dshStartupUpdate = function (view) {
  var api = window.__dshStartup;
  if (api.onView) { api.onView(view); return true; }
  api.view = view;
  return false;
};

window.__dshStartupShowFailure = function (config) {
  var api = window.__dshStartup;
  if (api.onFailure) return api.onFailure(config);
  return new Promise(function (resolve) {
    api.failure = { config: config, resolve: resolve };
  });
};
</script>
<style>
  /*
    Boot film + status dock.

    The window is the MAIN window (min 900x600, resizable, up to full screen), so
    the film is a full-bleed cover layer — never a fixed-size box — and everything
    the boot has to say sits in one dock at the foot, over a scrim that keeps it
    readable on any frame of the film. The frame's own wordmark is part of the
    film, so the page does not repeat it: the brand row is demoted to a quiet
    build stamp in the dock.

    Colours: the film is dark in every frame, so the dock's text is light in both
    themes and `body` is painted the film's own navy — that background is what
    the shell samples for the native window-control strip (window.ts
    `startChromeSync`) and what shows before the first frame decodes, so a light
    theme cannot flash white at either place. The failure card is the one surface
    that still follows the user's theme (it is a dialog, not part of the film).
  */
  :root {
    /* Dock palette, fixed: it sits on the film. */
    --dock-fg: rgb(244, 247, 255);
    --dock-fg-dim: rgba(232, 238, 252, 0.72);
    --dock-track: rgba(233, 240, 255, 0.18);
    --dock-accent: rgb(96, 150, 255);
    --dock-accent-soft: rgb(150, 196, 255);
    --dock-glass: rgba(10, 17, 38, 0.55);
    --dock-glass-hover: rgba(18, 29, 58, 0.72);
    --dock-hairline: rgba(226, 234, 255, 0.22);
    --dock-shadow: 0 10px 30px rgba(3, 8, 22, 0.45);
    /* The page's own background: the film's navy. */
    --startup-bg: rgb(13, 20, 36);

    /* Failure card tokens, from the shell's own design platform
       (`--dsw-alias-*`, light: body / dark: body[data-ds-dark-theme]) so the one
       dialog on this page matches the app it is opening. */
    --dsw-alias-bg-layer-1: rgb(255, 255, 255);
    --dsw-alias-label-primary: rgb(15, 17, 21);
    --dsw-alias-label-secondary: rgb(60, 60, 61);
    --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
    --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
    --dsw-alias-button-primary-fill: rgb(15, 17, 21);
    --dsw-alias-label-primary-foreground: rgb(255, 255, 255);
  }
  html[data-theme="dark"] {
    --dsw-alias-bg-layer-1: rgb(35, 35, 36);
    --dsw-alias-label-primary: rgb(249, 250, 251);
    --dsw-alias-label-secondary: rgb(207, 211, 214);
    --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
    --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
    --dsw-alias-button-primary-fill: rgb(249, 250, 251);
    --dsw-alias-label-primary-foreground: rgb(15, 17, 21);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  /*
    The backdrop lives on the ROOT element and `body` stays transparent, on
    purpose. The shell paints the native window-control strip with the colour it
    samples from the page: it walks up from the element under those controls to
    the first non-transparent background and applies THAT (window.ts, SAMPLE_FN).
    With the film behind everything the honest answer there is "nothing painted",
    so the walk has to fall through to `body`'s own transparent value — the strip
    is then applied with alpha 0 and the film shows through the buttons. Painting
    the navy on `body` is what made that strip an opaque near-black bar over the
    film; measured on Windows, `#00000000` is see-through and `#0d1424` is not
    (scratch/probe-overlay-alpha.mjs).
  */
  html { background: var(--startup-bg); }
  body {
    position: relative;
    overflow: hidden;
    background: transparent;
    color: var(--dock-fg);
    font: 13px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ------------------------------------------------------------------- film */
  #startup-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    /*
      `contain`, not `cover`: the film is 16:9 (2048x1152) and this window is
      resizable from 900x600 to full screen, so `cover` filled it by CROPPING —
      measured 142px of width at the 1280x800 default (71px off each side, which
      is the wordmark tile's left edge and the first thing a user noticed),
      167px at the 900x600 minimum and 178px at 1600x1000. Fitting instead of
      filling leaves bands, and the bands are the film's own navy
      (`--startup-bg`), so they read as part of it rather than as letterboxing.
    */
    object-fit: contain;
    background: var(--startup-bg);
    /* Decorative and never in the way: no controls, no pointer events (a film
       that swallows a click is how the pause button stops working). */
    pointer-events: none;
  }
  /* Legibility floor for the dock, painted over the film. Also carried into the
     top strip: the native window controls need a consistent backdrop. */
  .scrim {
    position: fixed;
    inset: 0;
    background:
      linear-gradient(to bottom, rgba(6, 11, 26, 0.55) 0, rgba(6, 11, 26, 0) 22%),
      linear-gradient(to top, rgba(4, 9, 24, 0.92) 0, rgba(4, 9, 24, 0.72) 26%, rgba(4, 9, 24, 0) 58%);
  }

  /* Drag handle: the whole reserved strip moves the window. Controls inside it
     would need -webkit-app-region: no-drag, and there are none — the audio
     toggle sits BELOW it (see #startup-audio), clear of the native buttons. */
  #startup-titlebar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 36px;
    /* Stop short of the native window controls (the main window reserves the
       same width): a drag region underneath them is how the close button ended
       up showing two stacked tooltips. */
    padding-right: 140px;
    -webkit-app-region: drag;
    z-index: 3;
  }

  /* ----------------------------------------------------------- audio toggle */
  #startup-audio {
    position: fixed;
    top: 48px;
    right: 20px;
    z-index: 4;
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--dock-hairline);
    border-radius: 50%;
    background: var(--dock-glass);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--dock-fg);
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }
  #startup-audio:hover { background: var(--dock-glass-hover); }
  #startup-audio:active { transform: scale(.94); }
  #startup-audio:focus-visible { outline: 2px solid var(--dock-accent-soft); outline-offset: 3px; }
  #startup-audio svg { width: 18px; height: 18px; display: block; }
  /* One icon pair, swapped by state: the slash is hidden while sound is on. */
  #startup-audio[aria-pressed="true"] .slash { display: none; }

  /* -------------------------------------------------------------------- dock */
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 28px 22px;
    text-align: center;
  }
  #startup-status {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .01em;
    text-shadow: 0 1px 12px rgba(3, 8, 22, 0.8);
  }
  .hint { margin: 0; font-size: 12px; color: var(--dock-fg-dim); }
  #startup-hint { margin-top: -6px; }

  /* Custom progress bar: a hairline track with a lit fill. Determinate carries
     the real ratio; indeterminate (extraction has no denominator yet) sweeps a
     soft comet, because a frozen bar over that span reads as a hang. */
  .bar-row { display: flex; align-items: center; gap: 12px; }
  #startup-bar {
    position: relative;
    flex: 1 1 auto;
    height: 6px;
    border-radius: 999px;
    background: var(--dock-track);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  #startup-bar-fill {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--dock-accent) 0%, var(--dock-accent-soft) 100%);
    box-shadow: 0 0 12px rgba(96, 150, 255, 0.55);
    transition: width .24s cubic-bezier(.2, .8, .3, 1);
  }
  #startup-bar[data-mode="indeterminate"] #startup-bar-fill {
    width: 34%;
    background: linear-gradient(90deg,
      rgba(96, 150, 255, 0) 0%,
      var(--dock-accent-soft) 45%,
      rgba(96, 150, 255, 0) 100%);
    box-shadow: none;
    animation: startup-sweep 1.5s cubic-bezier(.4, 0, .6, 1) infinite;
  }
  #startup-percent {
    flex: 0 0 auto;
    min-width: 42px;
    text-align: right;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--dock-fg-dim);
  }

  /* Step rail: the five stages the shell maps its status onto, as one
     horizontal row. Kept visible (not a bare "3/5") because it is what tells a
     first-launch user how much of a long wait is left, and because the failure
     card points back at it. */
  #startup-steps {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 18px;
    margin: 2px 0 0;
    padding: 0;
    list-style: none;
    font-size: 12px;
    color: var(--dock-fg-dim);
  }
  #startup-steps li { display: flex; align-items: center; gap: 7px; position: relative; }
  #startup-steps li::before {
    content: "";
    flex: 0 0 auto;
    width: 11px;
    height: 11px;
    border: 1.5px solid var(--dock-hairline);
    border-radius: 50%;
    transition: background-color .16s ease, border-color .16s ease;
  }
  #startup-steps li[data-state="current"] { color: var(--dock-fg); font-weight: 600; }
  #startup-steps li[data-state="current"]::before {
    border-color: var(--dock-accent);
    border-top-color: transparent;
    animation: startup-spin 1s linear infinite;
  }
  /* A finished step: the app's success token with a WHITE check drawn on top.
     The check is a rotated border shape, NOT a background image: the page's CSP
     blocks every resource without a directive, `img-src` among them — an
     SVG-background check renders as an empty green disc with no error anywhere
     (found the hard way, from a user's screenshot). */
  #startup-steps li[data-state="done"]::before {
    background-color: rgb(34, 197, 94);
    border-color: rgb(34, 197, 94);
  }
  #startup-steps li[data-state="done"]::after {
    content: "";
    position: absolute;
    left: 5.5px;
    top: 50%;
    width: 3px;
    height: 6px;
    border-right: 1.8px solid #fff;
    border-bottom: 1.8px solid #fff;
    transform: translate(-50%, -62%) rotate(45deg);
  }

  /* ---------------------------------------------------------------- dock foot */
  .dock-foot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #startup-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #startup-digest {
    margin: 0;
    font-size: 11.5px;
    color: var(--dock-fg-dim);
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }
  /* The fixed wish, quietest thing on the page: it carries no state. */
  #startup-saying {
    margin: 0;
    font-size: 11.5px;
    color: var(--dock-fg-dim);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .brand-stamp {
    margin: 0;
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 11px;
    color: rgba(232, 238, 252, 0.5);
    font-variant-numeric: tabular-nums;
  }
  #startup-name { font-weight: 600; letter-spacing: .06em; }

  /* ------------------------------------------------------------------ buttons */
  button {
    padding: 7px 16px;
    min-height: 32px;
    border: 1px solid var(--dock-hairline);
    border-radius: 999px;
    background: var(--dock-glass);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--dock-fg);
    font: inherit;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  button:hover:not(:disabled) { background: var(--dock-glass-hover); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--dock-accent-soft); outline-offset: 2px; }

  /* ------------------------------------------------------------- failure card
     A dialog, not part of the film: centred over its own mask, in the user's
     theme, so it reads as the app telling them something rather than as part of
     the opening. */
  #startup-error {
    position: fixed;
    z-index: 5;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, calc(100vw - 64px));
    max-height: calc(100vh - 96px);
    overflow: auto;
    padding: 18px 20px;
    border: 1px solid var(--dsw-alias-border-l2);
    border-radius: 16px;
    background: var(--dsw-alias-bg-layer-1);
    color: var(--dsw-alias-label-primary);
    box-shadow: var(--dock-shadow);
    text-align: left;
    animation: startup-rise .18s ease-out;
  }
  #startup-error::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: rgba(4, 9, 24, 0.66);
  }
  #startup-error-title { margin: 0 0 6px; font-weight: 600; font-size: 14px; }
  #startup-error-detail {
    margin: 0 0 12px;
    font-size: 12px;
    color: var(--dsw-alias-label-secondary);
    word-break: break-all;
    white-space: pre-line;
  }
  #startup-error .hint { margin: 10px 0 0; font-size: 11.5px; color: var(--dsw-alias-label-secondary); }
  #startup-error-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  #startup-error button {
    border-radius: 10px;
    border-color: var(--dsw-alias-border-l2);
    background: transparent;
    color: var(--dsw-alias-label-primary);
  }
  #startup-error button:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
  /* The primary pair from the app's own buttons (primitives/Button.module.css):
     fill and foreground flip together, so the label can never vanish. */
  #startup-error button[data-primary] {
    background: var(--dsw-alias-button-primary-fill);
    border-color: var(--dsw-alias-button-primary-fill);
    color: var(--dsw-alias-label-primary-foreground);
  }
  #startup-error button[data-primary]:hover:not(:disabled) { opacity: .9; }

  @keyframes startup-spin { to { transform: rotate(360deg); } }
  @keyframes startup-sweep {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
  @keyframes startup-rise {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 4px)); }
    to { opacity: 1; transform: translate(-50%, -50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #startup-bar-fill { transition: none; }
    #startup-bar[data-mode="indeterminate"] #startup-bar-fill { width: 60%; animation: none; }
    #startup-steps li[data-state="current"]::before { animation: none; border-top-color: var(--dock-accent); }
    #startup-error { animation: none; }
  }
</style>
</head>
<body>
  <!-- The opening film: muted, looping, cover. Muted autoplay needs no user
       gesture (an unmuted one would be refused outright on a page nobody has
       clicked yet), and the toggle below the title strip is what turns sound on
       — that click IS the gesture Chromium wants. -->
  <video id="startup-video" src="media/DSH-APP%20startup.mp4"
         autoplay muted loop playsinline preload="auto"
         aria-hidden="true" tabindex="-1"></video>
  <div class="scrim" aria-hidden="true"></div>
  <div id="startup-titlebar"></div>

  <button id="startup-audio" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6.5 8.5H3.5v7h3L11 19z"/>
      <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path class="waves" d="M18 6a8.5 8.5 0 0 1 0 12"/>
      <path class="slash" d="M4 4l16 16"/>
    </svg>
  </button>

  <main class="dock">
    <p id="startup-status" role="status" aria-live="polite">正在启动 DSH APP…</p>
    <p id="startup-hint" class="hint">首次启动需要准备运行环境，可能需要几十秒。</p>
    <div class="bar-row">
      <div id="startup-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-mode="indeterminate">
        <span id="startup-bar-fill"></span>
      </div>
      <span id="startup-percent" hidden></span>
    </div>
    <!-- Step labels: index order must match stageForMessage() in startup-window.ts. -->
    <ol id="startup-steps">
      <li>准备运行时</li>
      <li>解压运行时</li>
      <li>激活运行时</li>
      <li>启动内核服务</li>
      <li>打开界面</li>
    </ol>
    <div class="dock-foot">
      <div id="startup-actions">
        <button id="startup-pause" type="button" hidden></button>
      </div>
      <p id="startup-digest" hidden></p>
      <p id="startup-saying">首先您要健康，其次才是其次</p>
      <p class="brand-stamp"><span id="startup-name">DSH APP</span><span id="startup-version"></span></p>
    </div>
  </main>

  <section id="startup-error" hidden>
    <p id="startup-error-title"></p>
    <p id="startup-error-detail" hidden></p>
    <div id="startup-error-actions"></div>
    <p class="hint">可重试启动，或打开日志目录查看最新日志。</p>
  </section>

  <script>
  (function () {
    var api = window.__dshStartup;
    var root = document.documentElement;
    var video = document.getElementById('startup-video');
    var audio = document.getElementById('startup-audio');
    var steps = document.querySelectorAll('#startup-steps li');
    var status = document.getElementById('startup-status');
    var bar = document.getElementById('startup-bar');
    var fill = document.getElementById('startup-bar-fill');
    var percent = document.getElementById('startup-percent');
    var actions = document.getElementById('startup-actions');
    var errorBox = document.getElementById('startup-error');
    var errorTitle = document.getElementById('startup-error-title');
    var errorDetail = document.getElementById('startup-error-detail');
    var errorActions = document.getElementById('startup-error-actions');
    var digest = document.getElementById('startup-digest');
    var saying = document.getElementById('startup-saying');
    var name = document.getElementById('startup-name');
    var version = document.getElementById('startup-version');
    // Skeleton copy targets, addressed structurally so the static markup keeps
    // its own Chinese fallbacks for the moment before the first injection.
    var headerHint = document.getElementById('startup-hint');
    var failureHint = document.querySelector('#startup-error .hint');
    var pauseButton = document.getElementById('startup-pause');
    /** Labels for the sound toggle, replaced by the shell's language on push. */
    var soundLabels = { on: '开启声音', off: '关闭声音' };
    /** Resolver armed by the shell for exactly one click; see awaitPause. */
    var pendingPause = null;
    pauseButton.addEventListener('click', function () {
      if (pendingPause === null) return;
      var resolve = pendingPause;
      pendingPause = null;
      resolve(true);
    });

    /**
     * Sound is OFF on entry and the film plays muted, because a first-launch
     * page has had no user gesture: an unmuted autoplay would be refused
     * outright. This click is that gesture, so turning sound ON works — and it
     * costs nothing but a preference-free toggle (nothing is persisted: the next
     * start opens muted again, which is what "default quiet" means).
     */
    function paintAudio() {
      var on = video.muted !== true;
      audio.setAttribute('aria-pressed', on ? 'true' : 'false');
      var label = on ? soundLabels.off : soundLabels.on;
      audio.setAttribute('aria-label', label);
      audio.title = label;
    }
    audio.addEventListener('click', function () {
      if (video.muted === true) {
        video.muted = false;
        // The gesture is in hand; a rejected play() would only mean the element
        // never started, so put it back in motion and re-mute on failure.
        var started = video.play();
        if (started && typeof started.catch === 'function') {
          started.catch(function () { video.muted = true; paintAudio(); });
        }
      } else {
        video.muted = true;
      }
      paintAudio();
    });
    paintAudio();
    // Reduced motion: hold the first frame instead of looping ten seconds of
    // movement behind the status text.
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      video.autoplay = false;
      try { video.pause(); } catch (error) { /* already paused */ }
    }

    /**
     * Arm the control for exactly one click. Resolves true when clicked, false
     * when the boot settles it because the download moved on — the shell AWAITS
     * this promise, so it must settle on every path or the main process waits
     * forever for a click that can no longer happen. Visibility and labels come
     * from the pushed state (see render), never from here: the state is the
     * single source of truth for what the user sees.
     */
    window.__dshStartupAwaitPause = function () {
      return new Promise(function (resolve) { pendingPause = resolve; });
    };

    function render(view) {
      var stage = Math.max(0, Math.min(steps.length, view.stage || 0));
      for (var i = 0; i < steps.length; i += 1) {
        var state = stage === 0 ? '' : i + 1 < stage ? 'done' : i + 1 === stage ? 'current' : 'pending';
        if (state === '') steps[i].removeAttribute('data-state');
        else steps[i].setAttribute('data-state', state);
      }
      status.textContent = view.message || '';
      // Appearance and brand: pushed like everything else, so a reloaded page
      // (the replay path) comes back in the same theme with the same version.
      root.setAttribute('data-theme', view.theme === 'dark' ? 'dark' : 'light');
      if (view.brand) {
        if (view.brand.name) name.textContent = view.brand.name;
        version.textContent = view.brand.version ? 'v' + view.brand.version : '';
      }
      // Skeleton copy: the page ships Chinese fallbacks so it renders before
      // any injection; these replace them with the shell's language.
      if (view.skeleton) {
        for (var s = 0; s < steps.length && s < view.skeleton.steps.length; s += 1) {
          steps[s].textContent = view.skeleton.steps[s];
        }
        if (headerHint) headerHint.textContent = view.skeleton.hint;
        if (failureHint) failureHint.textContent = view.skeleton.failureHint;
        if (view.skeleton.soundOn) soundLabels.on = view.skeleton.soundOn;
        if (view.skeleton.soundOff) soundLabels.off = view.skeleton.soundOff;
        paintAudio();
      }
      // The pause control belongs to the download step only. Its visibility and
      // label follow the pushed state, so a status change is always reflected
      // even when no awaiter is parked at that instant.
      pauseButton.hidden = view.pausable !== true;
      actions.hidden = view.pausable !== true;
      pauseButton.textContent = view.paused === true
        ? (view.skeleton ? view.skeleton.resume : '继续下载')
        : (view.skeleton ? view.skeleton.pause : '暂停下载');
      // The shell keeps a promise parked on the control: settling it as "not
      // applicable" here is what stops that promise from leaking when the
      // download ends or the boot fails.
      if (view.pausable !== true && pendingPause !== null) {
        var settle = pendingPause;
        pendingPause = null;
        settle(false);
      }
      // Verification note: only ever shown when the shell has something true to
      // say (a recorded digest for this install), never as a generic badge.
      digest.textContent = view.digest ? '运行时已校验 · ' + view.digest : '';
      digest.hidden = !view.digest;
      if (typeof view.saying === 'string' && view.saying !== '') saying.textContent = view.saying;
      var progress = view.progress;
      if (typeof progress === 'number' && isFinite(progress)) {
        var whole = Math.min(100, Math.max(0, Math.round(progress * 100)));
        bar.setAttribute('data-mode', 'determinate');
        bar.setAttribute('aria-valuenow', String(whole));
        fill.style.width = whole + '%';
        percent.textContent = whole + '%';
        percent.hidden = false;
      } else {
        // Indeterminate: extraction lists the archive before it can report a
        // denominator, and a frozen bar over that span reads as a hang.
        bar.setAttribute('data-mode', 'indeterminate');
        bar.removeAttribute('aria-valuenow');
        fill.style.width = '';
        percent.hidden = true;
      }
    }

    function showFailure(config) {
      return new Promise(function (resolve) {
        errorTitle.textContent = config.title || '';
        errorDetail.textContent = config.detail || '';
        errorDetail.hidden = !config.detail;
        errorActions.textContent = '';
        var answered = false;
        var buttons = config.actions || [];
        buttons.forEach(function (action) {
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = action.label;
          if (action.primary) button.setAttribute('data-primary', 'true');
          button.addEventListener('click', function () {
            // One answer per card: the injected promise must settle once.
            if (answered) return;
            answered = true;
            for (var i = 0; i < errorActions.children.length; i += 1) {
              errorActions.children[i].disabled = true;
            }
            resolve(action.id);
          });
          errorActions.appendChild(button);
        });
        errorBox.hidden = false;
        // The card is the only thing left to act on; the step rail and the bar
        // behind it are history, so take the focus to the primary answer.
        var primary = errorActions.querySelector('button[data-primary]');
        if (primary) primary.focus();
      });
    }

    api.onView = function (view) {
      // A new progress state means the boot moved on (e.g. the retry after a
      // failure); the stale failure card must not stay on screen.
      errorBox.hidden = true;
      render(view);
    };
    api.onFailure = showFailure;

    if (api.view) { var view = api.view; api.view = null; api.onView(view); }
    if (api.failure) {
      var pending = api.failure;
      api.failure = null;
      showFailure(pending.config).then(pending.resolve);
    }
  })();
  </script>
</body>
</html>
