name: release

# Builds kernel runtime artifacts (per platform/arch) and the Electron app for
# Windows / macOS / Linux, then publishes everything to a GitHub Release.
# Triggers: push of a tag like v0.1.0 (shell) — the kernel version is read
# from the npm registry dist-tag at build time, or pinned via inputs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh kernel version to bundle (default: dist-tag)'
        required: false
        type: string

permissions:
  contents: write

env:
  DSH_VERSION: ${{ inputs.dsh_version || '' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Create the single draft release BEFORE any parallel job attaches assets.
  # electron-builder and the runtime Attach step both create the release when
  # none exists; without this dedicated first job they race and end up with two
  # v0.1.7 drafts and uploads split across them.
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --draft

  runtime:
    name: runtime (${{ matrix.os }}/${{ matrix.arch }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
          # macOS: macos-15-intel is the supported x64 runner (macos-13 is
          # deprecated Dec 2025); macos-latest is arm64. Building on a
          # same-arch runner avoids cross-compiling native optional deps.
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          # Linux: ubuntu-24.04-arm is a free arm64 runner for public repos.
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # build-runtime.mjs imports `tar` from the root package; the runner is a
      # clean checkout, so install root deps before running it.
      - name: Install dependencies
        run: npm ci

      - name: Build suite plugins
        shell: bash
        working-directory: plugins
        run: |
          for p in plugin-brand plugin-client-ui; do
            # Use each plugin's own build script (brand: tsc, client-ui: esbuild
            # loader-wrapped bundle). A bare `npx tsc` would neither produce the
            # client bundle the dsh loader expects nor match published typings.
            (cd $p && npm install --no-audit --no-fund --legacy-peer-deps && npm run build)
          done

      - name: Build kernel runtime
        run: node scripts/build-runtime.mjs ${{ matrix.platform }} ${{ matrix.arch }} "${{ env.DSH_VERSION }}"

      - name: Attach runtime to release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --draft
          gh release upload "$TAG" runtime-dist/dsh-runtime-*.tgz runtime-dist/dsh-runtime-*.tgz.sha512 runtime-dist/manifest.json --clobber

      # Also expose the tgz as a workflow artifact so the app job can bundle it
      # into the installer without re-downloading from the (still-draft) release.
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            runtime-dist/dsh-runtime-*.tgz
            runtime-dist/dsh-runtime-*.tgz.sha512
          retention-days: 1

  app:
    name: app (${{ matrix.os }}/${{ matrix.arch }})
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: win32
            target: win
          - os: macos-15-intel
            arch: x64
            platform: darwin
            target: mac
          - os: macos-latest
            arch: arm64
            platform: darwin
            target: mac
          - os: ubuntu-latest
            arch: x64
            platform: linux
            target: linux
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build shell
        run: npm run build

      # Pull the matching kernel tgz built by the runtime job and stage it as
      # bundled-kernel/ so electron-builder's extraResources ships it inside the
      # installer (first-launch local activation, no user download).
      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime-dist

      - name: Stage bundled kernel
        shell: bash
        run: node scripts/prepare-bundled-kernel.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            npx electron-builder --mac --${{ matrix.arch }} --publish always --config.mac.notarize=true
          else
            # No signing credentials configured: ship an unsigned build
            # instead of failing the whole release.
            npx electron-builder --mac --${{ matrix.arch }} --publish always --config.mac.notarize=false --config.mac.identity=null
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # Both Windows arches must be built in ONE electron-builder invocation:
        # upstream publishes a single per-platform update file (latest.yml) that
        # carries both arches; two parallel --win --x64 / --win --arm64 jobs
        # race to upload the same filename and the loser fails 422 already_exists.
        # The bundled kernel is staged for x64; Windows-on-ARM (≈0 users today)
        # falls back to an online kernel download on first launch (the artifact
        # source defaults to JochenYang/dsh-app so that resolves).
        run: npx electron-builder --win --x64 --arm64 --publish always

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # deb packaging uses fpm (x86 binary only); on arm64 runners it
          # cannot execute, so restrict arm64 to AppImage.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npx electron-builder --linux --arm64 --publish always --config.linux.target=AppImage
          else
            npx electron-builder --linux --x64 --publish always
          fi
