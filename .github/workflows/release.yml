name: release

# Action versions are pinned per action rather than unified: checkout and
# setup-node reach node24 at v5, upload-artifact at v6, download-artifact at
# v7 (v5/v6 of the artifact actions still run node20). Going higher buys
# nothing here — download-artifact v8 moves to ESM with new enforced checks.
# All four require Actions runner >= 2.327.1, which GitHub-hosted satisfies.

# Builds kernel runtime artifacts (per platform/arch) and the Electron app for
# Windows / macOS / Linux, then publishes everything to a GitHub Release.
# Triggers: push of a tag like v0.1.0 (shell) — the kernel version is read
# from the npm registry dist-tag at build time, or pinned via inputs.
# ModelScope mirroring is deliberately NOT here: it runs after the draft is
# published (publish-mirror.yml).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh kernel version to bundle (default: dist-tag)'
        required: false
        type: string

permissions:
  contents: write
  # Needed by the runtime job's closing step, which dispatches the ModelScope
  # mirror for the tag it just finished (see that step for why the dispatch is
  # what makes the mirror an ordinary postcondition of the build).
  actions: write

env:
  DSH_VERSION: ${{ inputs.dsh_version || '' }}
  # No channel pin here on purpose. Which kernel line to follow comes from the
  # @deepseek-ai/dsh* dependency in package.json through scripts/kernel-line.mjs
  # — the same spec the shell and every plugin are typechecked against — and the
  # resolved version is asserted to satisfy it before anything is built. A
  # second, hand-flipped copy of the channel in this file is exactly how v0.11.1
  # bundled a 0.1.5-alpha.2 kernel beside rc-typed code with CI fully green.
  # DSH_APP_CHANNEL stays available as an explicit cross-line override.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Create the single draft shell release BEFORE the parallel app jobs publish
  # installers. electron-builder creates the release when none exists, but a
  # dedicated first job removes the race between the app matrix cells. Runtime
  # artifacts no longer attach here — they go to their own runtime-* tags (see
  # the runtime job), so on workflow_dispatch this job is skipped.
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A tag whose version has no bilingual CHANGELOG section would publish
      # an empty release page (v0.13.2 shipped that way and the notes had to
      # be attached afterwards). The section is folded from the changeset
      # fragments before tagging, so this only fails a tag cut without one.
      - name: Verify the tag's changelog section
        run: node scripts/check-changeset.mjs --tag "${{ github.ref_name }}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --draft

  # Resolve the kernel version once and decide whether the runtime matrix can
  # be skipped: rebuilding 6 platforms of an already-published
  # runtime-<dshVersion> is pure waste when only the shell changed, so a tag
  # push reuses the existing assets and the app job downloads them from the
  # release instead of the workflow artifact. workflow_dispatch always builds
  # (it exists to publish new/changed runtimes).
  resolve:
    runs-on: ubuntu-latest
    outputs:
      dsh_version: ${{ steps.resolve.outputs.dsh_version }}
      skip_runtime: ${{ steps.resolve.outputs.skip_runtime }}
      suite_version: ${{ steps.resolve.outputs.suite_version }}
    steps:
      # kernel-line.mjs reads the followed kernel line straight out of the
      # tree's package.json, so this job needs the checkout and its deps.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Resolve kernel version and check existing artifacts
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSH_VERSION_INPUT: ${{ inputs.dsh_version || '' }}
        run: |
          # The followed line, its dist-tag and the tree's suite version all
          # come from package.json via kernel-line.mjs. An explicitly pinned
          # version is asserted against that same line, so a pin that would
          # bundle a kernel the code was not built against fails here instead
          # of shipping a silently mismatched installer.
          LINE="$(node scripts/kernel-line.mjs --json)"
          SUITE_VERSION="$(printf '%s' "$LINE" | jq -r .suiteVersion)"
          echo "followed line: $LINE" >&2
          if [ -n "$DSH_VERSION_INPUT" ]; then
            DSH_VERSION="$(node scripts/kernel-line.mjs --assert "$DSH_VERSION_INPUT")"
          else
            DSH_VERSION="$(node scripts/kernel-line.mjs --resolve)"
          fi
          echo "dsh_version=$DSH_VERSION" >> "$GITHUB_OUTPUT"
          # Exposed so the mirror job can prove an asset came from THIS tree
          # rather than from a previous run of the same kernel line: every
          # per-cell manifest carries `suiteVersion`, and the value is a content
          # hash of the plugin versions plus the office kit pin, so it changes
          # exactly when the runtime's contents do.
          echo "suite_version=$SUITE_VERSION" >> "$GITHUB_OUTPUT"
          # All 6 cells × (tgz + sha512 + per-cell manifest + layer index + the
          # office payload's three assets) must be present; anything missing (or
          # no release at all) means a full rebuild. The layer index is required
          # for the same reason a sidecar is: its ABSENCE is invisible to the
          # client, which is documented to fall back to the single tarball, so a
          # release published without layers would be reused forever and every
          # kernel update would keep paying the full ~96 MiB download with
          # nothing red anywhere. The office payload is required for a sharper
          # version of that: the runtime no longer carries the engine, so a
          # release without it leaves office conversion permanently unavailable
          # while the runtime install looks perfectly healthy.
          TAG="runtime-$DSH_VERSION"
          if ! ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            echo "no $TAG release; building" >&2
            echo "skip_runtime=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for p in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            for name in "dsh-runtime-${p}-${DSH_VERSION}.tgz" "dsh-runtime-${p}-${DSH_VERSION}.tgz.sha512" "manifest-${p}.json" "layers-${p}.json" "office-payload-${p}-${DSH_VERSION}.tgz" "office-payload-${p}-${DSH_VERSION}.tgz.sha512" "office-payload-${p}.json"; do
              if ! grep -qxF "$name" <<< "$ASSETS"; then
                echo "missing $name on $TAG; building" >&2
                echo "skip_runtime=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          # Complete is not the same as current: a runtime published from an
          # earlier suite is still complete, and reusing it would bundle stale
          # plugins into the installer. Compare the suite version baked into
          # EVERY cell's published manifest against this tree's — a single-cell
          # check passes a MIXED set (measured on run 35495273559: five cells
          # were current while win32-arm64 still carried the previous suite, so
          # that platform would have kept shipping stale plugins and nothing in
          # the release turned red). An unreadable manifest rebuilds rather than
          # trusting an unknown.
          probe="$(mktemp -d)"
          for p in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            if ! gh release download "$TAG" -D "$probe" -p "manifest-${p}.json" >/dev/null 2>&1; then
              echo "could not read $TAG's manifest for $p; building to be safe" >&2
              echo "skip_runtime=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            published="$(node -e "try{console.log(require('$probe/manifest-${p}.json').suiteVersion ?? '')}catch{console.log('')}")"
            if [ "$published" != "$SUITE_VERSION" ]; then
              echo "$TAG's $p carries suite '$published' but this tree has '$SUITE_VERSION'; building" >&2
              echo "skip_runtime=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # The office payload's identity rides the same release and is NOT
          # covered by the suite version: the Python set it carries is pinned by
          # scripts/primary-runtime-lock.json, and a release whose payload
          # predates that set stays complete, current-looking — and useless,
          # because the shell installs exactly the payload version its kernel
          # manifest names, so the host's load_workspace_dependencies would keep
          # failing with ENOENT forever. Compare each cell's declared Python
          # component against what this tree stages (Linux cells stage none: the
          # host accepts only win32/darwin manifests).
          EXPECTED_PYTHON="$(node -e "console.log(require('./scripts/primary-runtime-lock.json').pythonVersion)")"
          # The KIT is the other half of that identity, and it is checked against
          # the PAYLOAD sidecar rather than the runtime manifest the suite check
          # above reads: the two are separate assets on the same release, and a
          # payload upload that failed or was clobbered leaves the runtime looking
          # current while every installed client would fetch a payload whose kit
          # is not the one this tree pins. (`computeSuiteVersion` does cover the
          # pin, so a pin bump alone already trips the suite check — this is the
          # comparison that survives a half-published release, and it names the
          # kit by value when it fires.)
          EXPECTED_KIT="$(node -e "
            import('./scripts/kernel-line.mjs').then((m) => console.log(m.DESKTOP_OFFICE_KIT_VERSION))
              .catch((err) => { console.error(String(err)); process.exit(1) })
          ")"
          for p in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            if ! gh release download "$TAG" -D "$probe" -p "office-payload-${p}.json" >/dev/null 2>&1; then
              echo "could not read $TAG's office payload sidecar for $p; building to be safe" >&2
              echo "skip_runtime=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "$p" in
              linux-*) WANTED_PYTHON='null' ;;
              *) WANTED_PYTHON="\"$EXPECTED_PYTHON\"" ;;
            esac
            PUBLISHED_PYTHON="$(node -e "try{console.log(JSON.stringify(require('$probe/office-payload-${p}.json').components?.python ?? null))}catch{console.log('')}")"
            if [ "$PUBLISHED_PYTHON" != "$WANTED_PYTHON" ]; then
              echo "$TAG's office payload for $p declares python $PUBLISHED_PYTHON, this tree stages $WANTED_PYTHON; building" >&2
              echo "skip_runtime=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PUBLISHED_KIT="$(node -e "try{console.log(require('$probe/office-payload-${p}.json').components?.kit ?? '')}catch{console.log('')}")"
            if [ "$PUBLISHED_KIT" != "$EXPECTED_KIT" ]; then
              echo "$TAG's office payload for $p carries kit $PUBLISHED_KIT but this tree pins $EXPECTED_KIT; building" >&2
              echo "skip_runtime=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "$TAG already complete for suite $SUITE_VERSION; skipping runtime matrix" >&2
          echo "skip_runtime=true" >> "$GITHUB_OUTPUT"

  runtime:
    name: runtime (${{ matrix.os }}/${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.skip_runtime != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
          # macOS: macos-15-intel is the supported x64 runner (macos-13 is
          # deprecated Dec 2025); macos-latest is arm64. Building on a
          # same-arch runner avoids cross-compiling native optional deps.
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          # Linux: ubuntu-24.04-arm is a free arm64 runner for public repos.
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      # Where the PRIVATE @deepseek-ai/dsh-desktop-host's source comes from: the
      # upstream repository at the tag of the kernel line being built. The tag
      # is not a free variable — build-runtime.mjs derives `dsh-v<dshVersion>`
      # from the version this cell resolved and asserts the packed host's own
      # version against it, so a source from another line fails the build.
      # The repository variable only moves the CLONE SOURCE (a domestic mirror
      # or a private fork); the default upstream stays in place when it is
      # unset. The `||` is load-bearing: an EMPTY DSH_APP_HOST_REPO_URL means
      # "cloning disabled" to build-runtime.mjs and fails the cell, so an unset
      # variable must never be forwarded as an empty string.
      # A private mirror needs a credential: keep it out of this URL (the clone
      # command line is logged) and give git a credential helper or an
      # `url.<...>.insteadOf` rewrite in a step instead.
      DSH_APP_HOST_REPO_URL: ${{ vars.DSH_APP_HOST_REPO_URL || 'https://github.com/deepseek-ai/deepseek-harness.git' }}
      # Tag override for a mirror whose tags are named differently. Empty — the
      # default when the variable is unset — falls back to `dsh-v<dshVersion>`.
      DSH_APP_HOST_TAG: ${{ vars.DSH_APP_HOST_TAG }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # build-runtime.mjs assembles the kernel with pnpm (≥10 is asserted, and a
      # too-old one fails the build loudly). The runner's preinstalled pnpm
      # changes with the image, so pin it here rather than inherit whatever the
      # image happens to carry: an image bump must not be able to fail a release.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # Building the host the shell starts the kernel with means a second,
      # much larger install inside the harness checkout (its workspace closure
      # plus the tsc/tsdown toolchain), and six cells run it. The pnpm store is
      # content-addressed, so a restored entry can never stand in for different
      # bytes; per-runner keying keeps a Linux store from serving a macOS or
      # Windows cell, and the prefix restore-keys keep the bulk warm across a
      # kernel-line bump, where only the moved packages are fetched.
      - name: pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          # `tr -d '\r'`: a Windows pnpm answers with CRLF, and a cache path
          # with a stray CR would miss on every run — silently.
          echo "path=$(pnpm store path --silent | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ matrix.arch }}-${{ needs.resolve.outputs.dsh_version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ matrix.arch }}-${{ needs.resolve.outputs.dsh_version }}-
            pnpm-store-${{ runner.os }}-${{ matrix.arch }}-

      # build-runtime.mjs imports `tar` from the root package; the runner is a
      # clean checkout, so install root deps before running it.
      - name: Install dependencies
        run: npm ci

      # The desktop host's load_workspace_dependencies tool answers with a
      # "primary runtime" (Python + Node.js + pnpm) it installs from the office
      # payload the shell hands it; a payload without one fails every call with
      # ENOENT on <payload>/primary-runtime/runtime.json. The staged tree is
      # passed to build-runtime.mjs below, which copies it into the payload.
      # Linux cells skip this: the host's readPrimaryRuntime accepts only win32
      # and darwin manifests (apps/desktop-host/src/primary-runtime.ts), so a
      # linux tree could never be installed — scripts/build-primary-runtime.mjs
      # refuses to build one, and those cells ship the engine-only payload.
      - name: Build primary runtime
        id: primary-runtime
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          node scripts/build-primary-runtime.mjs ${{ matrix.platform }} ${{ matrix.arch }}
          echo "dir=runtime-dist/primary-runtime-${{ matrix.platform }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      # The staged Python+Node+pnpm set used to ship unexecuted everywhere but
      # win32-x64 (the machine this repo is developed on). This step installs
      # the staged tree with the desktop host's OWN code and exercises the
      # interpreters BEFORE the runtime build packs it — a broken set fails the
      # cell, where it is cheap to fix, instead of a user's machine. macos-15-intel
      # and macos-latest run it natively; win32-arm64 cannot (see the condition).
      - name: Smoke the staged primary runtime
        # A CROSS-BUILT cell cannot smoke: the host refuses a tree whose
        # manifest names another arch than the running process ("primary
        # runtime: incompatible platform or architecture", measured on the
        # win32-arm64 cell of run 35494896864). win32-arm64 is built on an x64
        # runner and the matrix has no arm64 Windows runner, so its Python set
        # remains the one that ships unexecuted; every other non-linux cell
        # executes the tree it is about to pack.
        if: matrix.platform != 'linux' && !(matrix.platform == 'win32' && matrix.arch == 'arm64')
        shell: bash
        env:
          DSH_VERSION: ${{ needs.resolve.outputs.dsh_version }}
        run: |
          # The tag prepareDesktopHostSource derives: DSH_APP_HOST_TAG wins,
          # else dsh-v<dshVersion> (both job-level env, same defaults). Trim:
          # build-runtime.mjs's hostTag() trims, so a whitespace-only override
          # must not become `git clone --branch " "` here.
          tag="$(printf '%s' "${DSH_APP_HOST_TAG:-}" | tr -d '[:space:]')"
          if [ -z "$tag" ]; then tag="dsh-v$DSH_VERSION"; fi
          rm -rf runtime-dist/host-src
          git clone --filter=blob:none --depth 1 --no-tags --branch "$tag" "$DSH_APP_HOST_REPO_URL" runtime-dist/host-src
          # The smoke re-execs the host's own TypeScript module through `tsx
          # --import`, and a fresh clone carries no node_modules: without this
          # install the step dies on "has no tsx installed" before it verifies
          # anything. `--filter .` installs the workspace ROOT project, which
          # is where the smoke looks for tsx (the same install build-runtime
          # runs for its own clone, minus the desktop-host closure this step
          # does not build). `--frozen-lockfile`: the checkout is a tag, so the
          # lockfile is the resolution upstream released.
          (cd runtime-dist/host-src && pnpm install --frozen-lockfile --ignore-scripts --filter .)
          DSH_APP_HARNESS_CHECKOUT=runtime-dist/host-src \
            node scripts/smoke-primary-runtime.mjs runtime-dist/primary-runtime-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Build suite plugins
        shell: bash
        working-directory: plugins
        run: |
          # KEEP IN SYNC with the suite roster: SUITE_PLUGINS in
          # scripts/kernel-line.mjs (build-runtime.mjs imports it from there),
          # SUITE_PLUGIN_DIRS in src/main/brand-suite.ts, SUITE_DIRS in
          # scripts/smoke-suite.mjs, and the overlay rows in
          # plugins/dsh-app.patch.yml. every shipped plugin must be installed +
          # built before the runtime step copies lib/ into the artifact.
          # build-runtime.mjs rebuilds them anyway; this pre-pass guarantees
          # each plugin's own node_modules is ready.
          for p in plugin-brand plugin-client-ui plugin-sidebar plugin-swarm plugin-usage plugin-archives plugin-memory plugin-mcp plugin-hooks plugin-ppt plugin-market plugin-presets plugin-doc plugin-sheet plugin-pdf plugin-websearch; do
            # Use each plugin's own build script (brand: tsc, client-ui: esbuild
            # loader-wrapped bundle). A bare `npx tsc` would neither produce the
            # client bundle the dsh loader expects nor match published typings.
            (cd $p && npm install --no-audit --no-fund --legacy-peer-deps && npm run build)
          done

      - name: Build kernel runtime
        id: runtime
        env:
          # Empty on linux cells (the step that sets it is skipped there), which
          # build-runtime.mjs reads as "no Python set" — the payload those cells
          # must ship, because the host cannot install one on Linux.
          DSH_APP_PRIMARY_RUNTIME: ${{ steps.primary-runtime.outputs.dir }}
        run: node scripts/build-runtime.mjs ${{ matrix.platform }} ${{ matrix.arch }} "${{ env.DSH_VERSION }}"

      # Runtime artifacts attach to their own `runtime-<dshVersion>` tag
      # (created published — artifacts are public releases), NOT the shell
      # v* tag. The app's GitHubArtifactResolver resolves exactly this URL
      # shape, and this keeps kernel updates decoupled from shell releases:
      # workflow_dispatch can publish artifacts for a dsh version without
      # cutting a shell tag. The version comes from build-runtime's output
      # (dist-tag resolution when DSH_VERSION is empty).
      # The release MUST be flagged --prerelease: otherwise GitHub's
      # /releases/latest alias resolves to the newest runtime tag (it has no
      # latest.yml) and the shell's app-update check 404s (Sep 2026 incident).
      #
      # The office payload rides the SAME release. It is version-addressed by
      # the dsh version (its own content version lives inside the manifest), so
      # the shell resolves it from the kernel's release tag alone, exactly like
      # the runtime tarball. Its sidecar name is per cell for the same reason
      # the runtime manifest is: six parallel cells must not clobber one name.
      - name: Attach runtime to release
        shell: bash
        env:
          TAG: runtime-${{ steps.runtime.outputs.dsh_version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Six cells race to create the tag; a 422 already_exists from a
          # losing create is harmless (upload --clobber below is idempotent),
          # so swallow create failures and only let the upload fail loudly.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --prerelease || true
          # manifest.json carries platform/arch: name it per matrix cell so the
          # parallel cells never clobber the same asset name (a --clobber race
          # previously 404'd on a concurrently-deleted asset) nor leave the
          # last-writer's platform in the shared name.
          cp runtime-dist/manifest.json "runtime-dist/manifest-${PLATFORM}-${ARCH}.json"
          gh release upload "$TAG" runtime-dist/dsh-runtime-*.tgz runtime-dist/dsh-runtime-*.tgz.sha512 "runtime-dist/manifest-${PLATFORM}-${ARCH}.json" --clobber
          # The office payload (the LibreOffice engine the runtime no longer
          # carries): uploaded here, with the cell that built it. Its absence is
          # invisible to the runtime install — the tree boots fine without an
          # engine — and would surface only as "document conversion is not
          # installed" for every user of that cell, which is why the resolve job
          # requires these three assets before it reuses a release. A kernel
          # line without the office provider publishes none at all (the build
          # writes no files), and bash expands an unmatched glob literally —
          # which would fail the whole cell with a misleading "file not found"
          # for a tree that is legitimately engine-less.
          if compgen -G "runtime-dist/office-payload-*.tgz" > /dev/null; then
            gh release upload "$TAG" runtime-dist/office-payload-*.tgz runtime-dist/office-payload-*.tgz.sha512 "runtime-dist/office-payload-${PLATFORM}-${ARCH}.json" --clobber
          else
            echo "no office payload for ${PLATFORM}-${ARCH}: this kernel line publishes none"
          fi

      # Split the tgz into cacheable layers for the client's incremental path
      # (a dsh bump then downloads the ~10 MiB `dsh` layer instead of ~96 MiB).
      # Deliberately AFTER the single tgz is attached: the tgz is the only
      # artifact an older client can consume and the fallback for every client
      # when anything here fails, so a split fault must fail the cell — loudly,
      # on purpose — but never after keeping the tgz out of the release. The
      # script re-assembles what it emitted and refuses a set that does not
      # reproduce the input tree.
      - name: Split runtime into layers
        shell: bash
        run: node scripts/split-runtime-layers.mjs runtime-dist/dsh-runtime-*.tgz --out runtime-dist/layers

      - name: Attach layers to release
        shell: bash
        env:
          TAG: runtime-${{ steps.runtime.outputs.dsh_version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Layer names already carry platform/arch; the INDEX name must too —
          # six cells build the same layers.json, and a shared name would leave
          # the last writer's platform in every cell's index. Keep the name in
          # sync with layerIndexAssetName() in src/kernel/layers.ts.
          cp runtime-dist/layers/layers.json "runtime-dist/layers/layers-${PLATFORM}-${ARCH}.json"
          gh release upload "$TAG" runtime-dist/layers/*.tgz "runtime-dist/layers/layers-${PLATFORM}-${ARCH}.json" --clobber

      # A rebuilt runtime produces new layer names (they carry content digests),
      # and `--clobber` cannot remove the ones its predecessor left: layer names
      # that changed simply become new assets, so the release accumulates dead
      # tarballs that no index names. Measured on 0.1.6-alpha.2: a rebuild left
      # ten of them, and the mirror's completeness guard refused the whole
      # runtime — "not named by any layer index" — until they were deleted by
      # hand. Each cell prunes ITS OWN platform's unreferenced layer assets, so
      # the six cells never race on a name.
      - name: Prune superseded layer assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: runtime-${{ steps.runtime.outputs.dsh_version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          INDEX="runtime-dist/layers/layers-${PLATFORM}-${ARCH}.json"
          node -e '
            const index = require("./" + process.argv[1])
            for (const layer of index.layers) console.log(layer.name)
          ' "$INDEX" | sort > "$RUNNER_TEMP/claimed.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep -E "^((meta|vendor|node|suite)-.*-${PLATFORM}-${ARCH}\\.tgz)$" | sort > "$RUNNER_TEMP/present.txt" || true
          comm -13 "$RUNNER_TEMP/claimed.txt" "$RUNNER_TEMP/present.txt" | while read -r name; do
            echo "removing superseded layer asset $name" >&2
            gh release delete-asset "$TAG" "$name" --yes
          done

      # Also expose the tgz as a workflow artifact so the app job can bundle it
      # into the installer without re-downloading from the (still-draft) release.
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v6
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            runtime-dist/dsh-runtime-*.tgz
            runtime-dist/dsh-runtime-*.tgz.sha512
            runtime-dist/manifest.json
          retention-days: 1

  # Mirror the finished runtime to ModelScope.
  #
  # Why a SEPARATE job and not a step inside the runtime matrix: the matrix cells
  # finish in an arbitrary order and upload their assets at different times, so
  # "am I the last one?" has to be answered by polling a shared list — and that
  # question cannot be answered correctly from inside a cell. Measured on
  # v0.14.3, with the dispatch living in the last cell to notice:
  #
  #   * the completeness check counted assets the PREVIOUS run had left behind.
  #     Asset names carry the dsh version and nothing else (`manifest-<cell>.json`
  #     carries no version at all), so a rebuild of the same kernel line reuses
  #     the exact names — `ubuntu-arm64` reported 17/18 at 16:45:48 with only the
  #     six linux assets uploaded, and `win32-x64` dispatched at 16:51:29 while
  #     `darwin-x64` still held its PREVIOUS payload;
  #   * `darwin-x64`'s own check then reported 1/18 at 16:55:29, with its assets
  #     uploaded at 16:53:02 — a listing that came back short, its error swallowed
  #     by the `2>/dev/null` the check needed to survive a missing tag.
  #
  # The mirror therefore copied a stale `office-payload-darwin-x64`: that
  # platform's office conversion would have been one kit version behind while
  # every job stayed green. A backfill was needed to repair it.
  #
  # `needs: runtime` makes the ordering a fact instead of a race: this job starts
  # only after every cell has finished, so a single listing is complete by
  # construction. Ordering alone is not enough, though — a complete list of
  # WRONG assets is still wrong, and names cannot carry that distinction (a
  # rebuild of one kernel line reuses every name). The step below therefore
  # proves each cell by CONTENT — the per-cell manifest against this tree's dsh
  # version and suite version, the tgz's sha512 sidecar against that manifest's
  # `integrity`, the layer index against the suite layer name it has to name,
  # and the office payload's sidecar against the version the manifest declares.
  # All of it is small sidecar downloads; the ~96 MiB tarballs are never fetched
  # here.
  #
  # An earlier revision filtered the listing by `updated_at >= run_started_at`
  # instead. It was dropped rather than kept as a second line of defence: a
  # wall-clock comparison needs two clocks to agree, says nothing about what the
  # bytes are, and passes a previous run's asset whenever windows overlap — the
  # exact failure it was meant to catch. Content is the property that has to
  # hold before a mirror is written.
  #
  # Why the mirror is dispatched from here rather than left to the mirror
  # workflow's own event trigger: `publish-mirror.yml` reacts to
  # `release: published`, and a runtime release is created published (the app's
  # resolver needs it that way), so that event fires in the middle of the upload
  # while the workflow's own filter keeps `runtime-*` out of the shell path. The
  # result was a runtime whose mirror was never written: the first 0.1.6-alpha.2
  # cells went up, nothing mirrored them, and every cell answered 404 through the
  # ModelScope chain while looking healthy.
  mirror-runtime:
    if: ${{ !cancelled() && needs.runtime.result == 'success' }}
    name: mirror runtime to ModelScope
    needs: [resolve, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Verify this run's runtime set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.dsh_version }}
          TAG: runtime-${{ needs.resolve.outputs.dsh_version }}
          SUITE: ${{ needs.resolve.outputs.suite_version }}
        run: |
          set -euo pipefail
          problems=""
          note() {
            problems="$problems $1"
            echo "$1" >&2
          }

          # One listing, once. Every cell has finished by the time this job
          # starts, so the NAMES below are complete by construction — the defect
          # this job was written for came from reading a list mid-flight and
          # believing the answer.
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/names.txt"; then
            echo "::error::could not list $TAG; nothing was mirrored" >&2
            exit 1
          fi

          # Names cannot tell THIS run's assets from a previous run's: rebuilding
          # one kernel line reproduces every name, and neither the manifest nor
          # the layer index names the dsh version in its file name at all. So
          # each cell is proven from the small sidecars' CONTENT below.
          probe="$(mktemp -d)"
          for cell in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            platform="${cell%-*}"
            arch="${cell##*-}"
            tgz="dsh-runtime-${cell}-${VERSION}.tgz"
            for name in "$tgz.sha512" "manifest-${cell}.json" "layers-${cell}.json"; do
              grep -qxF "$name" "$RUNNER_TEMP/names.txt" || note "absent: $name"
            done
            mkdir -p "$probe/$cell"
            if ! gh release download "$TAG" -D "$probe/$cell" \
              -p "manifest-${cell}.json" -p "layers-${cell}.json" -p "$tgz.sha512" >/dev/null 2>&1; then
              note "unreadable: ${cell} manifest/layers/sha512 could not be downloaded"
              continue
            fi
            manifest="$probe/$cell/manifest-${cell}.json"
            layers="$probe/$cell/layers-${cell}.json"

            got="$(jq -r '.dshVersion // ""' "$manifest")"
            [ "$got" = "$VERSION" ] || note "$cell: manifest dshVersion is '$got', expected '$VERSION'"
            got="$(jq -r '.suiteVersion // ""' "$manifest")"
            [ "$got" = "$SUITE" ] || note "$cell: manifest suiteVersion is '$got', expected '$SUITE'"
            got="$(jq -r '.platform + "-" + .arch' "$manifest")"
            [ "$got" = "$cell" ] || note "$cell: manifest describes $got, not $cell"

            # The sidecar is the value every client verifies the tarball against;
            # one left by another build would name another digest.
            got="$(tr -d '[:space:]' < "$probe/$cell/$tgz.sha512")"
            claimed="$(jq -r '.integrity // ""' "$manifest")"
            [ "$got" = "$claimed" ] || note "$cell: $tgz.sha512 does not match the manifest integrity"

            got="$(jq -r '.suiteVersion // ""' "$layers")"
            [ "$got" = "$SUITE" ] || note "$cell: layer index suiteVersion is '$got', expected '$SUITE'"
            # The index is what the incremental path caches by. An index left by
            # another build names another suite layer, and a client would keep
            # serving old plugins from a file this release no longer implies.
            if ! jq -e --arg n "suite-${SUITE}-${platform}-${arch}.tgz" '.layers | any(.name == $n)' "$layers" >/dev/null; then
              note "$cell: layer index does not name suite-${SUITE}-${platform}-${arch}.tgz"
            fi

            # The office payload is the asset that actually went stale in the
            # incident, and it rides its OWN version (the kit pin), not the dsh
            # version. It is checked wherever the manifest — already proven to be
            # this build's — declares one: a kernel line without an office
            # provider publishes none.
            declared="$(jq -r '.officePayload.version // ""' "$manifest")"
            [ -n "$declared" ] || continue
            payload="office-payload-${cell}-${VERSION}.tgz"
            for name in "$payload" "$payload.sha512" "office-payload-${cell}.json"; do
              grep -qxF "$name" "$RUNNER_TEMP/names.txt" || note "absent: $name"
            done
            if ! gh release download "$TAG" -D "$probe/$cell" \
              -p "office-payload-${cell}.json" -p "$payload.sha512" >/dev/null 2>&1; then
              note "unreadable: ${cell} payload metadata could not be downloaded"
              continue
            fi
            sidecar="$probe/$cell/office-payload-${cell}.json"
            got="$(jq -r '.payloadVersion // ""' "$sidecar")"
            [ "$got" = "$declared" ] || note "$cell: payload sidecar is version '$got', manifest declares '$declared'"
            got="$(jq -r '.platform + "-" + .arch' "$sidecar")"
            [ "$got" = "$cell" ] || note "$cell: payload sidecar describes $got, not $cell"
            got="$(tr -d '[:space:]' < "$probe/$cell/$payload.sha512")"
            claimed="$(jq -r '.integrity // ""' "$sidecar")"
            [ "$got" = "$claimed" ] || note "$cell: $payload.sha512 does not match the payload sidecar integrity"
          done

          if [ -n "$problems" ]; then
            # Loud, not silent: the previous design logged a shrug and moved on,
            # which is how a stale payload reached the mirror unnoticed. A red
            # job tells the releaser to backfill — `gh workflow run
            # publish-mirror.yml -f tag=$TAG` — rather than leaving a mirror that
            # answers 404 through the ModelScope chain while every job is green.
            echo "::error::this run's runtime set is not fully up:$problems" >&2
            exit 1
          fi
          echo "all six cells verified against dsh $VERSION, suite $SUITE"

      - name: Dispatch the ModelScope mirror
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: runtime-${{ needs.resolve.outputs.dsh_version }}
        run: |
          set -euo pipefail
          gh workflow run publish-mirror.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
          echo "queued the ModelScope mirror for $TAG (the six-cell set is verified from this run)"

  # Runs only on tag pushes. workflow_dispatch is the runtime-only path:
  # publish kernel artifacts for a dsh version without cutting a shell release.
  app:
    # `!cancelled()` lets the reuse path (skip_runtime=true, runtime job
    # skipped) still run; without it GitHub skips every `needs: runtime`
    # job when the runtime job is skipped, and the "download from release"
    # branch below never executes — a shell-only release would ship empty.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    name: app (${{ matrix.os }}/${{ matrix.arch }})
    needs: [resolve, runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: win32
            target: win
          - os: macos-15-intel
            arch: x64
            platform: darwin
            target: mac
          - os: ubuntu-latest
            arch: x64
            platform: linux
            target: linux
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build shell
        run: npm run build

      # Pull the matching kernel tgz and stage it as bundled-kernel/ so
      # electron-builder's extraResources ships it inside the installer
      # (first-launch local activation, no user download). Fresh build:
      # workflow artifact from the runtime job above. Reuse path (the runtime
      # job was skipped as already published): download the same asset
      # names from the runtime release instead. Both branches key on
      # needs.runtime.result so a skipped runtime matrix can never fall
      # through to the wrong download source.
      - name: Download kernel artifact
        if: needs.runtime.result != 'skipped'
        uses: actions/download-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime-dist

      - name: Download kernel artifact from release
        if: needs.runtime.result == 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: runtime-${{ needs.resolve.outputs.dsh_version }}
        run: |
          mkdir -p runtime-dist
          gh release download "$TAG" --repo "${{ github.repository }}" \
            -D runtime-dist \
            -p "dsh-runtime-${{ matrix.platform }}-${{ matrix.arch }}-*.tgz" \
            -p "dsh-runtime-${{ matrix.platform }}-${{ matrix.arch }}-*.tgz.sha512" \
            -p "manifest-${{ matrix.platform }}-${{ matrix.arch }}.json"
          # prepare-bundled-kernel expects the shared manifest.json name.
          cp "runtime-dist/manifest-${{ matrix.platform }}-${{ matrix.arch }}.json" runtime-dist/manifest.json

      - name: Stage bundled kernel
        shell: bash
        run: node scripts/prepare-bundled-kernel.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      # macOS shares the single-update-file constraint with Windows: latest-mac.yml
      # must carry both arches, so x64 + arm64 are built in ONE invocation. The
      # bundled kernel is staged for x64; Apple Silicon users get the correct
      # darwin-arm64 kernel via an automatic online download on first launch.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            npx electron-builder --mac --x64 --arm64 --publish always --config.mac.notarize=true
          else
            # No signing credentials configured: ship an unsigned build
            # instead of failing the whole release.
            npx electron-builder --mac --x64 --arm64 --publish always --config.mac.notarize=false --config.mac.identity=null
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # Both Windows arches must be built in ONE electron-builder invocation:
        # upstream publishes a single per-platform update file (latest.yml) that
        # carries both arches; two parallel --win --x64 / --win --arm64 jobs
        # race to upload the same filename and the loser fails 422 already_exists.
        # The bundled kernel is staged for x64; Windows-on-ARM (≈0 users today)
        # falls back to an online kernel download on first launch (the artifact
        # source defaults to JochenYang/dsh-app so that resolves).
        run: npx electron-builder --win --x64 --arm64 --publish always

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # deb packaging uses fpm (x86 binary only); on arm64 runners it
          # cannot execute, so restrict arm64 to AppImage.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npx electron-builder --linux --arm64 --publish always --config.linux.target=AppImage
          else
            npx electron-builder --linux --x64 --publish always
          fi

      # Assert what was actually packaged, before anything is published. A
      # missing asar entry, a stale file left under dist/static, or an installer
      # without the bundled kernel's adoption metadata all build green and only
      # surface as a broken first launch. Auto-detects the unpacked output for
      # this platform/arch (see scripts/smoke-package.mjs).
      - name: Smoke the packaged app
        run: node scripts/smoke-package.mjs

  # ModelScope mirroring deliberately does NOT live here. The mirror must run
  # only after a human flips the draft to published, and no job in this file can
  # observe that moment — it would mirror right after the app matrix, keeping
  # every version later discarded during review in ModelScope forever. It is a
  # separate event-driven workflow instead: publish-mirror.yml
  # (`on: release: types: [published]`), which also owns manual backfill.
  #
  # The one dispatch this file does make is `mirror-runtime` above, for a runtime
  # release — created published, so the event cannot be its trigger. See that
  # job's comment for why its ordering and asset set are proven, not assumed.
