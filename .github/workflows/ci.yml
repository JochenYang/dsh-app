# PR/push gate: the checks that only ran at release time (or by hand) before.
# The heavy runtime-artifact pipeline stays in release.yml; this workflow is
# the fast static + unit + real-kernel smoke gate for everyday changes.
name: ci

# Action versions are pinned per action rather than unified: checkout and
# setup-node reach node24 at v5, upload-artifact at v6, download-artifact at
# v7 (v5/v6 of the artifact actions still run node20). Going higher buys
# nothing here — download-artifact v8 moves to ESM with new enforced checks.
# All four require Actions runner >= 2.327.1, which GitHub-hosted satisfies.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck + plugins + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck shell + kernel
        run: npm run typecheck
      # Static plugin-graph rules: core packages declared as peers, no packaged
      # node_modules, dsh peer ranges tracking the followed kernel line, suite
      # roster matching the plugins on disk. Needs no kernel and no network, so
      # it belongs in this fast gate rather than in the smoke job.
      - name: Plugin graph (static)
        run: npm run check:graph
      # Root suites cover the shell updater chain and the kernel manager. They
      # require dist/ (npm test builds first), and until now they only ran by
      # hand — a broken unit test could sit on main indefinitely.
      - name: Shell + kernel unit tests
        run: npm test
      - name: Build suite plugins
        run: |
          # Each plugin owns its dependencies (docx, exceljs, pptxgenjs, ...),
          # so the workspace install above is not enough: install per plugin
          # first, exactly like the release job does.
          for dir in plugins/*/; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build)
            fi
          done
      - name: Plugin unit tests
        run: |
          # Every suite that has one, not a fixed pair: eleven suites previously
          # ran only on a developer's machine, which is how "upstream API drift"
          # stayed green in CI while failing at runtime. A plugin without a
          # tests/ directory is skipped, so the loop needs no maintenance list.
          for dir in plugins/*/; do
            if [ -d "$dir/tests" ]; then
              (cd "$dir" && npm test)
            fi
          done

  smoke:
    name: suite smoke probe (real kernel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Same host-source wiring as release.yml's runtime matrix: this job also
      # builds a real runtime, and the PRIVATE @deepseek-ai/dsh-desktop-host has
      # no registry source, so its code comes from the harness repository at the
      # kernel line's own tag (`dsh-v<dshVersion>`, derived and then asserted by
      # build-runtime.mjs). The repository variable only moves the clone source
      # (a domestic mirror or a private fork); `||` keeps the default in place
      # because an EMPTY value means "cloning disabled" and fails the build.
      # Keep the two workflows in step — see release.yml for the cache steps.
      DSH_APP_HOST_REPO_URL: ${{ vars.DSH_APP_HOST_REPO_URL || 'https://github.com/deepseek-ai/deepseek-harness.git' }}
      DSH_APP_HOST_TAG: ${{ vars.DSH_APP_HOST_TAG }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # This job builds a real kernel runtime, and build-runtime.mjs assembles it
      # with pnpm (asserting ≥10). Pin the version: the runner's preinstalled one
      # varies with the image, and a release gate must not depend on that.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install dependencies
        run: npm ci
      - name: Build suite plugins
        run: |
          # Each plugin owns its dependencies (docx, exceljs, pptxgenjs, ...),
          # so the workspace install above is not enough: install per plugin
          # first, exactly like the release job does.
          for dir in plugins/*/; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build)
            fi
          done
      # Same recipe as the release.yml runtime job for one cell: resolve the
      # kernel from the configured channel's dist-tag and npm-install the real
      # runtime the app ships, so the probe exercises the shipped composition.
      - name: Build kernel runtime (linux x64)
        run: node scripts/build-runtime.mjs linux x64
      - name: Run suite smoke probe
        # --tgz, not --runtime: the tgz mode is the only one that also runs the
        # artifact-level assertions (template catalogs, bundled fonts, packaged
        # resource lists) — the regression class where a build silently drops a
        # runtime file the plugin needs. The script extracts the tarball itself.
        run: node scripts/smoke-suite.mjs --tgz runtime-dist/dsh-runtime-linux-x64-*.tgz
