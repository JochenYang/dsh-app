# DSH APP brand suite — loader overlay injected by the desktop shell via
# `dsh web --patch`. Applied AFTER every bundle layer and the profile's own
# cordis.patch.yml (last write wins per row), so these rows join the composed
# tree without touching the upstream profile templates.
#
# - The upstream Models settings page is left enabled (the brand shadow was
#   retired: the upstream page is more complete and better maintained).
# - brand: host plugin (settings namespace / desktop bridge scaffold).
# - brand-client-ui: dual-face package; the loader entry makes its node half
#   visible to the client-modules scan, which picks up the `dsh.client`
#   declaration and serves /plugins/@dsh-app/plugin-client-ui/client.js.
# - swarm: batch parallel subagent orchestration over the upstream subagent
#   seam (model-facing `swarm` tool + `/swarm` command), dual-face: the
#   package.json `dsh.client` declaration adds the settings-page section
#   (并行子代理) whose knobs are declared as volatile config fields on the
#   plugin's own Config schema, so the kernel's config editor stores them as
#   a row in this profile patch (see the swarm row below).
#   Needs a kernel whose base bundle registers a subagent provider; older
#   kernels boot without it.
# - usage: usage statistics over session logs (host capture/aggregation +
#   settings-page heatmap and daily trend chart). Coexists with third-party
#   usage plugins (read-only shared source, namespaced store/routes); its
#   `enabled` / `pricing` / `backfillOnStart` / `rescanMinutes` knobs are
#   declared as volatile config fields on the plugin's own Config schema, so
#   the kernel's config editor stores them as a row in this profile patch
#   (see the usage row below). The JSON store this plugin used to read
#   (`<DSH_HOME>/storages/dsh-app-plugin-usage/config.json`) is imported once
#   and kept aside.
# - archives: session archive manager (host list/delete routes over the
#   workspace registry's archive set + settings-page section grouping
#   archived sessions by project). Deletion is fenced server-side to
#   archived, non-live sessions only.
# - memory: cross-session memory (host memory_save/memory_recall tools +
#   system-prompt injection of the persisted files + background distiller and
#   curator passes that review quiet sessions through direct model calls +
#   settings-page toggles). Model-driven saving with a code-guaranteed async
#   net; users disable it via
#   <DSH_HOME>/storages/dsh-app-plugin-memory/config.json.
# - mcp: MCP manager — settings-page CRUD over external MCP servers. The
#   user's server set lives in
#   $DSH_HOME/storages/dsh-app-plugin-mcp/servers.json (the overlay is
#   rewritten by the shell on every start and can never hold user state);
#   the plugin dynamically mounts one @deepseek-ai/dsh-mcp-client instance
#   per enabled server, so their tools register as mcp__<server>__<tool>.
#   Mount failures degrade to per-server status and never fail the boot.
# - ppt: editable PPTX generation — ppt_write/ppt_check/ppt_render tools over
#   a validated JSON deck format, a guiding skill installed into
#   $DSH_HOME/skills/dsh-app-ppt (content-compared, idempotent), and a
#   composer "PPT" button that seeds the input draft. Render failures are
#   per-element and never fail the boot.
# - market: plugin marketplace — a sidebar footer entry opens a drawer panel
#   over user-configurable catalog sources (https-only, size-capped); install
#   and uninstall delegate to the kernel CLI's plugin command with
#   registry-only version validation, serialized in-process to keep the
#   profile manifest consistent. CLI failures surface as panel errors and
#   never fail the boot.
# - doc: Word document mode — doc_write/doc_check/doc_render tools over a
#   validated JSON document project, rendered through the docx library to an
#   editable .docx. Word capsule in the shared office bar; render is gated on
#   a clean check and failures never fail the boot.
# - sheet: Excel workbook mode — sheet_write/sheet_check/sheet_render tools
#   over a validated JSON workbook project, rendered through the exceljs
#   library to an editable .xlsx (styles, number formats, formulas). Excel
#   capsule in the shared office bar; render is gated on a clean check.
# - pdf: PDF mode — pdf_read extracts text/metadata from workspace PDFs as
#   agent material; pdf_write/pdf_check/pdf_render build a paginated PDF
#   (check-gated export) with an embedded CJK font subset. PDF capsule in the
#   shared office bar.
# - presets: portable preset packages — a settings-page section exporting a
#   preset directory as a shareable .dshpreset archive (manifest + payload,
#   flate-packed) and importing archives back into the user preset root
#   ($DSH_HOME/.agent-presets). Entry names, archive paths, and sizes are
#   fenced to the kernel's own roster rules; conflicts need an explicit
#   overwrite confirmation. Failures degrade to per-request errors and never
#   fail the boot.
# - websearch: web search manager — registers ONE ctx.web search provider
#   whose engine chain (anysearch / bing / parallel / exa / searxng, in that
#   preference order) falls back automatically, plus ONE ctx.web fetch
#   provider that serves web_fetch with the host's contract plus a
#   fake-IP-safe resolution layer (proxy route when injected, system
#   resolver when clean, DNS-over-HTTPS when a canary probes the network as
#   poisoned), plus a settings-page section that orders engines, stores keys
#   and switches between the brand chain and the upstream DeepSeek provider.
#   The model-facing web_search / web_fetch tools are upstream's and are
#   never replaced: only the providers behind them change.
#   User state lives in
#   $DSH_HOME/storages/dsh-app-plugin-websearch/config.json (the overlay is
#   rewritten by the shell on every start). Engine failures are contained per
#   engine by the chain and never fail the boot; a fetch failure is a coded
#   per-request error, never a boot failure.

- insert:
    - id: brand
      name: '@dsh-app/plugin-brand'

    - id: brand-client-ui
      name: '@dsh-app/plugin-client-ui'

    - id: sidebar
      name: '@dsh-app/plugin-sidebar'

    - id: swarm
      name: '@dsh-app/plugin-swarm'
      config:
        provider: spawn
        # These knobs are declared as volatile config fields, so the settings
        # page writes them through the kernel's config editor — which appends a
        # row of its own to this profile patch. Patch semantics replace a row's
        # whole `config`, so the plugin's write path always carries every field,
        # and the values here are what an untouched knob keeps (not the schema
        # defaults: maxItems 8 and a pool of 4 are NOT the shipped tuning).
        enabled: true
        maxItems: 64
        # Two orthogonal knobs: maxItems bounds batch size only (the worker
        # pool bounds actual load, so a 64-item batch at pool 4 is just 16
        # sequential waves), while the concurrency knobs bound how many
        # children stream at once.
        # Adaptive scheduling (on by default) replaces static guessing for
        # gateways that drop concurrent streams without a rate-limit signal:
        # the live pool starts at defaultConcurrency, halves (floor 1) and
        # doubles the start stagger (cap 30s) whenever an item fails, and
        # grows back toward maxConcurrency one step after every 4 consecutive
        # completions, easing the stagger back to its base. At the ceiling,
        # clean streaks PROBE one level beyond (up to 64) on unpinned batches,
        # so the pool discovers gateway headroom on its own; a probe failure
        # relearns the ceiling below the failed level. An explicit
        # max_concurrency tool argument pins the pool (no exploration).
        # maxConcurrency is held at 12 against the `subagent` row's
        # maxActiveSubagents of 16 (see that row): the four-slot margin keeps
        # the model's own delegations from competing with a full batch for the
        # last slot. The 64-level probe above that ceiling is still reachable
        # only by clean streaks, and a probe past the kernel's pool is handled
        # as capacity backpressure — the item is re-queued, not failed.
        # Item-level auto-retry stacks on top: an item whose turn dies to a
        # transient provider error is followed up on the preserved child
        # session after an exponential backoff (15s, 30s), continuing from
        # the interruption point rather than restarting. Provider-level
        # request retries absorb sub-minute hiccups; this turn-level lane
        # absorbs the outages that exhaust them. Failures classify as
        # transport/capacity/content/structural from the child session's
        # turn/end error code — transport and capacity failures throttle the
        # pool, and only transport qualifies for auto-retry (a capacity
        # rejection re-queues the item instead, since the slot is still held).
        adaptive: true
        defaultConcurrency: 8
        maxConcurrency: 12
        startStaggerMs: 1000
        itemMaxRetries: 2
        itemRetryDelayMs: 15000
        perItemOutputLimit: 4000
        # Batch token budget (0 = disabled): once settled children's summed
        # usage reaches this, the batch stops launching work. Per-call
        # override: the swarm tool's token_budget argument.
        tokenBudget: 0
        # maxDepth is the absolute delegation-depth cap (harness-enforced):
        # 1 makes every child a leaf worker — its own delegation attempts are
        # refused, so all LLM load stays inside the concurrency gate. A deeper
        # tree would let grandchildren stream outside the gate's accounting.
        maxDepth: 1

    - id: usage
      name: '@dsh-app/plugin-usage'

    - id: archives
      name: '@dsh-app/plugin-archives'

    - id: memory
      name: '@dsh-app/plugin-memory'

    - id: mcp
      name: '@dsh-app/plugin-mcp'

    - id: hooks
      name: '@dsh-app/plugin-hooks'

    - id: ppt
      name: '@dsh-app/plugin-ppt'

    - id: market
      name: '@dsh-app/plugin-market'

    - id: presets
      name: '@dsh-app/plugin-presets'

    - id: doc
      name: '@dsh-app/plugin-doc'

    - id: sheet
      name: '@dsh-app/plugin-sheet'

    - id: pdf
      name: '@dsh-app/plugin-pdf'

    - id: websearch
      name: '@dsh-app/plugin-websearch'

# Web search seam: point BOTH capabilities at the suite's providers.
#
# This row is written as a PAIR on purpose. Patch semantics REPLACE the whole
# config object rather than merging into it (learned on dsh 0.1.2+), so a row
# that names only `searchProvider` silently drops `fetchProvider` — the fetch
# provider then gets re-registered by another layer and the composed tree dies
# on a duplicate loader entry, taking `web_fetch` down with it.
#
# `searchProvider: dsh-app` is the plugin's own engine chain (anysearch /
# bing / parallel / exa / searxng with automatic fallback). The upstream DeepSeek
# provider stays mounted and registered; the settings page switches between
# the two at runtime by rewriting this field, so a user can compare them
# without editing this file or restarting. Setting it back to
# `deepseek-official` here restores the stock search behavior.
#
# `fetchProvider: dsh-app-fetch` is the plugin's fetch provider, which serves
# `web_fetch` with the host's own contract (URL policy, same-origin redirects,
# byte/char caps, error codes) plus a resolution layer the host provider does
# not have: the host resolves through the system resolver and refuses a
# fake-IP answer (198.18.0.0/15, which a TUN client hands every process), so
# on such networks its `web_fetch` fails before a packet moves. Ours sends
# through the injected proxy when one applies, keeps the system resolver when
# it is clean, and switches to DNS-over-HTTPS when a canary probes it as
# poisoned. Setting this field back to `http` restores the host provider
# exactly — the two are drop-in substitutes for each other.
- id: web
  config:
    searchProvider: dsh-app
    fetchProvider: dsh-app-fetch

# The account provider's identity header. The base bundle's own row sets
# `desktopPlatform` behind `ctx.get('profileContext')?.name === 'desktop'`
# (`packages/bundle/base/cordis.patch.yml:115`), and on this line that guard is
# TRUE: the desktop host launches the Web application with `profile: "desktop"`
# (`dsh-desktop-host/lib/index.js:225`) while resolving OUR profile directory, so
# the composed name is `desktop` and not the directory's `dsh-app`.
#
# The row is kept anyway, unguarded: a host that resolves the profile name from
# the directory (`basename(dir)`, `dsh-app-boot/lib/index.js:949`) would otherwise
# leave `x-client-platform` unset and the platform would see an unidentified
# client even though the window IS a desktop one
# (`deepseek-account-platform/src/index.ts` builds that header from this flag).
#
# Patch semantics replace the WHOLE config object, so the field set here is the
# row's entire configuration. `null` on a platform the provider does not name is
# its own "no identity" value, which is the honest answer for anything but
# Windows and macOS.
- id: deepseek-account
  config:
    desktopPlatform: !!js "['darwin', 'win32'].includes(process.platform) ? process.platform : null"

# Upstream's product-telemetry pair, switched OFF here on purpose.
#
# Both rows are browser/desktop-only upstream (`disabled: !!js "ctx.get(
# 'profileContext')?.name !== 'desktop'"`) and export product usage events to
# DeepSeek's own collector (`dsh-host-product-telemetry-otel`, default endpoint
# `https://dsh-otel-collector.deepseeksvc.com/v1/logs`). That guard does NOT
# protect us: the desktop host reports `profile: "desktop"` (see above), so both
# rows load here — and the exporter then failed its config validation
# (`$.serviceVersion missing required value`, its `serviceVersion` reads
# `process.env.DSH_CLIENT_VERSION`, which only the official app sets). Measured
# 2026-09-29: the Plugins page showed `desktop-product-telemetry` as 启动失败 and
# every start logged `2 entries did not activate`.
#
# Disabling beats satisfying that config: publishing `DSH_CLIENT_VERSION` (the
# shell's own version is the honest value) would have made the row VALIDATE and
# then EXPORT — reporting this third-party client's usage to DeepSeek's collector
# as `deepseek-harness-desktop`, which is not a default anyone consented to. It
# would also open a hole in SAFE MODE, where the suite layer is written empty by
# design and these two rows would then run for real. So the shell publishes only
# `DSH_APP_SHELL_VERSION`, and a deliberate enable from the Plugins page still
# fails this validation — which is the safe direction, and the reason these rows
# are disabled here instead of being made valid.
- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# Session full-text search: override the base/web-app row's openAt from
# 'never' to 'first-search' (the sqlite handle is created lazily on the
# first search, so Node 22 startup stays quiet). The agent-side
# session_search/session_event_search tools stay unmounted: their package
# (@deepseek-ai/dsh-tool-session-query) is not in the CLI runtime closure
# (apps/cli has no dependency on it), so inserting that row fails the whole
# plugin tree (ERR_MODULE_NOT_FOUND → white screen). Re-add the insert once
# the package ships inside the CLI closure; until then the archives /search
# route reports agentToolAvailable: false.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# Continuable-subagent capacity, raised from the kernel's default of 8.
#
# This pool is SHARED, not swarm's own: the kernel keys it per root agent
# (`dsh-subagent` `ContinuableActivationRegistry.rootPool`), so the model's own
# delegations and every `swarm` batch draw on the same slots. The default of 8
# is also exactly what the swarm row's steady-state pool asks for, which left
# the adaptive pool's upward probes with nowhere to go: a probe that crossed 8
# was rejected with ACTIVATION_LIMIT_REACHED.
#
# 16 with swarm capped at 12 keeps a deliberate margin — four slots stay free
# for the model's own delegation while a full batch runs, so the two paths stop
# competing for the last slot. Raising this number raises the ceiling for the
# WHOLE process, not just for swarm; that is the trade being made here.
#
# The base bundle's own row carries no config, so this patch adds the field
# rather than replacing one. Patch semantics replace a row's whole `config`, so
# any field a future kernel line adds to that row must be copied here.
- id: subagent
  config:
    maxActiveSubagents: 16

# Schedule: session-scoped reminders (schedule_create/list/delete tools +
# read-only schedule directory in the session header). Only the schedule
# service is mounted — dsh-time-context is deliberately LEFT OUT: it injects
# the current time at every pre-step (token burn on every tool call), while
# schedule only needs the time at delivery (computed server-side). Users who
# need the time on demand use their own time plugin.
# Both packages are verified in the CLI runtime closure (apps/cli deps,
# 2026-09-07). Verified with the packaged bin.js before merging (never trust the
# dev pnpm closure alone): a missing package fails the whole tree, not one row.
#
# Both rows are INSERTS rather than overrides, because the row each one used to
# override is not on every line:
#
#   - 0.1.7-rc.2 ships the `schedule` row itself (disabled) and the `ui-schedule`
#     row (disabled), both in the web bundle — which is why the ui row used to be
#     flipped on here instead of inserted;
#   - 0.2.0-rc.1 ships NEITHER in the web bundle: they travel in
#     `@deepseek-ai/dsh-experimental-schedule-bundle`, which this profile does not
#     list (it also inserts `time-context`, which this overlay leaves out on
#     purpose). An override row then has no target at all: every start logs
#     `patch: entry "ui-schedule" not found` twice — once for this layer, once for
#     the profile patch's copy — and the schedule page silently stays absent.
#
# Being an insert keeps the capability on both lines. The composed tree then
# carries two rows per id on a line that ships its own (measured on the packaged
# rc.2 runtime): that is NOT a duplicate-loader-entry failure — every layer's
# patches are applied in ONE `applyEntryPatches` call
# (`dsh-app-boot/lib/index.js`), an id-less insert is a plain `data.push`, and the
# loader keys rows by id with the LAST one winning (`cordis-plugin-loader`), which
# is ours. The insert therefore SHADOWS the line's own row for that id, which is
# why ours carries nothing but `id` and `name`: a `config` here would replace a
# config the line sets.
#
# An insert is also what survives a rollback: an override no-ops on a kernel
# without the row, where a skipped row would silently drop the capability with only
# a log line.
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'

# Agent Teams: the veto that used to live here is GONE, and this note is kept so
# nobody re-adds it by reflex.
#
# The row this overlay disabled is `ui-agent-team`, inserted by the upstream
# bundle @deepseek-ai/dsh-experimental-agent-team-profile (0.1.6 shipped it in a
# separate `-web-profile` package; 0.1.7 merged the service, the tools and the UI
# into one bundle, which is what removed the reason for the veto). It was
# disabled because at 0.1.6-alpha.1 that client half failed against the loader of
# its own line, and a client-side plugin failure is not a warning here: the boot
# audit rejects the page, so the window sits on "Failed to load plugins" with
# nothing else reachable. Measured 2026-09-17 with the row present:
#   Failed to load plugins
#   @deepseek-ai/dsh-experimental-client-ui-agent-team
#   web boot: 1 entry did not activate
#   @deepseek-ai/dsh-experimental-client-ui-agent-team: failed
#
# Re-enabled on 0.1.7-alpha.1: the three packages the bundle depends on
# (`dsh-experimental-agent-team`, `-tool-agent-team`,
# `-client-ui-agent-team`) ship inside the runtime itself, so enabling it needs
# no download and cannot pull a version from another kernel line.
#
# The bundle is switched on in the PROFILE, not here: it has to be listed in
# `dsh.profile.bundles` for its patch layer to compose at all, and the shell
# never rewrites a profile's package.json — the enable survives every restart,
# which is exactly why it is not expressed as a row in this generated file.
# The row is deliberately NOT re-added with `disabled: false`: a profile that
# does not list the bundle has no row for it to act on, and an unmatched row is
# noise in every other profile this overlay is shared with.
