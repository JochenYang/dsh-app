# DSH APP brand suite — loader overlay injected by the desktop shell via
# `dsh web --patch`. Applied AFTER every bundle layer and the profile's own
# cordis.patch.yml (last write wins per row), so these rows join the composed
# tree without touching the upstream profile templates.
#
# - The upstream Models settings page is left enabled (the brand shadow was
#   retired: the upstream page is more complete and better maintained).
# - brand: host plugin (settings namespace / desktop bridge scaffold).
# - brand-client-ui: dual-face package; the loader entry makes its node half
#   visible to the client-modules scan, which picks up the `dsh.client`
#   declaration and serves /plugins/@dsh-app/plugin-client-ui/client.js.
# - swarm: batch parallel subagent orchestration over the upstream subagent
#   seam (model-facing `swarm` tool + `/swarm` command), dual-face: the
#   package.json `dsh.client` declaration adds the settings-page section
#   (并行子代理) editing $DSH_HOME/storages/dsh-app-plugin-swarm/config.json.
#   Needs a kernel whose base bundle registers a subagent provider; older
#   kernels boot without it.
# - usage: usage statistics over session logs (host capture/aggregation +
#   settings-page heatmap and daily trend chart). Coexists with third-party
#   usage plugins (read-only shared source, namespaced store/routes); users
#   disable it or extend the price table via
#   <DSH_HOME>/storages/dsh-app-plugin-usage/config.json.
# - archives: session archive manager (host list/delete routes over the
#   workspace registry's archive set + settings-page section grouping
#   archived sessions by project). Deletion is fenced server-side to
#   archived, non-live sessions only.
# - memory: cross-session memory (host memory_save/memory_recall tools +
#   system-prompt injection of the persisted files + background distiller and
#   curator passes that review quiet sessions through direct model calls +
#   settings-page toggles). Model-driven saving with a code-guaranteed async
#   net; users disable it via
#   <DSH_HOME>/storages/dsh-app-plugin-memory/config.json.
# - fff: fast file search over the FFF engine (in-process C library) — host
#   fffind/ffgrep/fff-glob LLM tools, per-workspace index managed by the
#   picker. Every search is fenced to the executing agent's session workspace;
#   no client half. Exit valve: remove this row (or tune config).
# - mcp: MCP manager — settings-page CRUD over external MCP servers. The
#   user's server set lives in
#   $DSH_HOME/storages/dsh-app-plugin-mcp/servers.json (the overlay is
#   rewritten by the shell on every start and can never hold user state);
#   the plugin dynamically mounts one @deepseek-ai/dsh-mcp-client instance
#   per enabled server, so their tools register as mcp__<server>__<tool>.
#   Mount failures degrade to per-server status and never fail the boot.
# - ppt: editable PPTX generation — ppt_write/ppt_check/ppt_render tools over
#   a validated JSON deck format, a guiding skill installed into
#   $DSH_HOME/skills/dsh-app-ppt (content-compared, idempotent), and a
#   composer "PPT" button that seeds the input draft. Render failures are
#   per-element and never fail the boot.
# - market: plugin marketplace — a sidebar footer entry opens a drawer panel
#   over user-configurable catalog sources (https-only, size-capped); install
#   and uninstall delegate to the kernel CLI's plugin command with
#   registry-only version validation, serialized in-process to keep the
#   profile manifest consistent. CLI failures surface as panel errors and
#   never fail the boot.
# - doc: Word document mode — doc_write/doc_check/doc_render tools over a
#   validated JSON document project, rendered through the docx library to an
#   editable .docx. Word capsule in the shared office bar; render is gated on
#   a clean check and failures never fail the boot.
# - sheet: Excel workbook mode — sheet_write/sheet_check/sheet_render tools
#   over a validated JSON workbook project, rendered through the exceljs
#   library to an editable .xlsx (styles, number formats, formulas). Excel
#   capsule in the shared office bar; render is gated on a clean check.
# - pdf: PDF mode — pdf_read extracts text/metadata from workspace PDFs as
#   agent material; pdf_write/pdf_check/pdf_render build a paginated PDF
#   (check-gated export) with an embedded CJK font subset. PDF capsule in the
#   shared office bar.
# - presets: portable preset packages — a settings-page section exporting a
#   preset directory as a shareable .dshpreset archive (manifest + payload,
#   flate-packed) and importing archives back into the user preset root
#   ($DSH_HOME/.agent-presets). Entry names, archive paths, and sizes are
#   fenced to the kernel's own roster rules; conflicts need an explicit
#   overwrite confirmation. Failures degrade to per-request errors and never
#   fail the boot.
# - websearch: web search manager — registers ONE ctx.web search provider
#   whose engine chain (anysearch / bing / parallel / exa / searxng, in that
#   preference order) falls back automatically, plus a settings-page section
#   that orders engines, stores keys and switches between the brand chain and
#   the upstream DeepSeek provider. The model-facing web_search tool is
#   upstream's and is never replaced: only the provider behind it changes.
#   User state lives in
#   $DSH_HOME/storages/dsh-app-plugin-websearch/config.json (the overlay is
#   rewritten by the shell on every start). Engine failures are contained per
#   engine by the chain and never fail the boot.

- insert:
    - id: brand
      name: '@dsh-app/plugin-brand'

    - id: brand-client-ui
      name: '@dsh-app/plugin-client-ui'

    - id: sidebar
      name: '@dsh-app/plugin-sidebar'

    - id: swarm
      name: '@dsh-app/plugin-swarm'
      config:
        provider: spawn
        maxItems: 64
        # Two orthogonal knobs: maxItems bounds batch size only (the worker
        # pool bounds actual load, so a 64-item batch at pool 4 is just 16
        # sequential waves), while the concurrency knobs bound how many
        # children stream at once.
        # Adaptive scheduling (on by default) replaces static guessing for
        # gateways that drop concurrent streams without a rate-limit signal:
        # the live pool starts at defaultConcurrency, halves (floor 1) and
        # doubles the start stagger (cap 30s) whenever an item fails, and
        # grows back toward maxConcurrency one step after every 4 consecutive
        # completions, easing the stagger back to its base. At the ceiling,
        # clean streaks PROBE one level beyond (up to 64) on unpinned batches,
        # so the pool discovers gateway headroom on its own; a probe failure
        # relearns the ceiling below the failed level. An explicit
        # max_concurrency tool argument pins the pool (no exploration).
        # Item-level auto-retry stacks on top: an item whose turn dies to a
        # transient provider error is followed up on the preserved child
        # session after an exponential backoff (15s, 30s), continuing from
        # the interruption point rather than restarting. Provider-level
        # request retries absorb sub-minute hiccups; this turn-level lane
        # absorbs the outages that exhaust them. Failures classify as
        # transport/content/structural from the child session's turn/end
        # error code — only transport failures throttle the pool and qualify
        # for auto-retry.
        adaptive: true
        defaultConcurrency: 8
        maxConcurrency: 16
        startStaggerMs: 1000
        itemMaxRetries: 2
        itemRetryDelayMs: 15000
        perItemOutputLimit: 4000
        # Batch token budget (0 = disabled): once settled children's summed
        # usage reaches this, the batch stops launching work. Per-call
        # override: the swarm tool's token_budget argument.
        # User-level overrides live in
        # $DSH_HOME/storages/dsh-app-plugin-swarm/config.json (this overlay is
        # rewritten by the shell on every start, so edits here do not stick
        # for end users — the config file wins over these values).
        tokenBudget: 0
        # maxDepth is the absolute delegation-depth cap (harness-enforced):
        # 1 makes every child a leaf worker — its own delegation attempts are
        # refused, so all LLM load stays inside the concurrency gate. A deeper
        # tree would let grandchildren stream outside the gate's accounting.
        maxDepth: 1

    - id: usage
      name: '@dsh-app/plugin-usage'

    - id: archives
      name: '@dsh-app/plugin-archives'

    - id: memory
      name: '@dsh-app/plugin-memory'

    - id: fff
      name: '@dsh-app/plugin-fff'

    - id: mcp
      name: '@dsh-app/plugin-mcp'

    - id: hooks
      name: '@dsh-app/plugin-hooks'

    - id: ppt
      name: '@dsh-app/plugin-ppt'

    - id: market
      name: '@dsh-app/plugin-market'

    - id: presets
      name: '@dsh-app/plugin-presets'

    - id: doc
      name: '@dsh-app/plugin-doc'

    - id: sheet
      name: '@dsh-app/plugin-sheet'

    - id: pdf
      name: '@dsh-app/plugin-pdf'

    - id: websearch
      name: '@dsh-app/plugin-websearch'

# Web search seam: point BOTH capabilities at the suite's provider.
#
# This row is written as a PAIR on purpose. Patch semantics REPLACE the whole
# config object rather than merging into it (learned on dsh 0.1.2+), so a row
# that names only `searchProvider` silently drops `fetchProvider` — the fetch
# provider then gets re-registered by another layer and the composed tree dies
# on a duplicate loader entry, taking `web_fetch` down with it.
#
# `searchProvider: dsh-app` is the plugin's own engine chain (anysearch /
# bing / parallel / exa / searxng with automatic fallback). The upstream DeepSeek
# provider stays mounted and registered; the settings page switches between
# the two at runtime by rewriting this field, so a user can compare them
# without editing this file or restarting. Setting it back to
# `deepseek-official` here restores the stock behavior.
- id: web
  config:
    searchProvider: dsh-app
    fetchProvider: http

# Session full-text search: override the base/web-app row's openAt from
# 'never' to 'first-search' (the sqlite handle is created lazily on the
# first search, so Node 22 startup stays quiet). The agent-side
# session_search/session_event_search tools stay unmounted: their package
# (@deepseek-ai/dsh-tool-session-query) is not in the CLI runtime closure
# (apps/cli has no dependency on it), so inserting that row fails the whole
# plugin tree (ERR_MODULE_NOT_FOUND → white screen). Re-add the insert once
# the package ships inside the CLI closure; until then the archives /search
# route reports agentToolAvailable: false.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# Schedule: session-scoped reminders (schedule_create/list/delete tools +
# read-only schedule directory in the session header). Only the schedule
# service is mounted — dsh-time-context is deliberately LEFT OUT: it injects
# the current time at every pre-step (token burn on every tool call), while
# schedule only needs the time at delivery (computed server-side). Users who
# need the time on demand use their own time plugin.
# The schedule package is verified in the CLI runtime closure (apps/cli deps,
# 2026-09-07); the ui row exists disabled in the web bundle and is flipped on
# here. Verified with the packaged bin.js before merging (never trust the dev
# pnpm closure alone): a missing package fails the whole tree, not one row.
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

- id: ui-schedule
  disabled: false

# Experimental Agent Teams — deliberately OFF for every profile of this app.
#
# The row belongs to the upstream bundle @deepseek-ai/dsh-experimental-agent-
# team-web-profile (its cordis.patch.yml inserts `ui-agent-team` ->
# @deepseek-ai/dsh-experimental-client-ui-agent-team). At 0.1.6-alpha.1 that
# entry does not activate — its published client half fails against the loader
# shipped in the same version, and the client boot audit reports it as `failed`
# — and a client-side plugin failure is not a warning here: that audit rejects
# the page, so the window is stuck on "Failed to load plugins" with nothing
# else reachable. Measured 2026-09-17 with the row present:
#   Failed to load plugins
#   @deepseek-ai/dsh-experimental-client-ui-agent-team
#   web boot: 1 entry did not activate
#   @deepseek-ai/dsh-experimental-client-ui-agent-team: failed
# A profile that lists the bundle composes exactly this row, and `dsh plugin`
# re-appends the bundle from its dependency on the next install, so the state
# can come back without anyone editing this file. Vetoed here because this
# overlay is applied after every bundle layer and is rewritten on each start —
# the disable survives a re-install, and dropping the row (or overriding it
# with `disabled: false` in the home layer, which applies last) is all it takes
# to turn Agent Teams back on once upstream republishes the package.
- id: ui-agent-team
  disabled: true
